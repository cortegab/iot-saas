; Generic device firmware: one build per board, configured per device by the
; `cfg` partition the dashboard writes when it flashes (firmware/README.md).
; Nothing here is per-device; never add a credential or a pin to this file.

[platformio]
default_envs = esp32, esp32c3

[env]
; pioarduino: Arduino core 3.x (the official espressif32 platform is still on 2.x,
; and the WiFiProv / NETWORK_PROV_* API the provisioning flow uses is 3.x only).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
; Pin exact versions: a release must be reproducible (docs/firmware/drivers.md).
lib_deps =
  knolleary/PubSubClient @ 2.8
  bblanchon/ArduinoJson @ 7.4.2
build_flags =
  -Wall

[env:esp32]
board = esp32dev

; EXPERIMENT (size): the stock ESP32 build carries Bluedroid + Classic BT and
; fills 97% of an OTA slot. Provisioning only needs BLE: NimBLE, as on the C3.
[env:esp32-nimble]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
custom_sdkconfig =
  CONFIG_BT_ENABLED=y
  CONFIG_BT_NIMBLE_ENABLED=y
  # CONFIG_BT_BLUEDROID_ENABLED is not set
  # CONFIG_BT_CLASSIC_ENABLED is not set

; Host-side unit tests for the pure parts (pio test -e native). Not a board.
[env:native]
platform = native
framework =
test_framework = unity
lib_deps =
build_flags = -Isrc

[env:esp32c3]
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
; Serial over the C3's own USB, so its log shows without a USB-UART chip.
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
