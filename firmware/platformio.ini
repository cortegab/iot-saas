; Generic device firmware: one build per board, configured per device by the
; `cfg` partition the dashboard writes when it flashes (firmware/README.md).
; Nothing here is per-device; never add a credential or a pin to this file.

[platformio]
default_envs = esp32, esp32c3, esp32s3, esp32c6, esp32s2

[env]
; pioarduino: Arduino core 3.x (the official espressif32 platform is still on 2.x,
; and the NETWORK_PROV_* API the provisioning flow uses is 3.x only). 55.03.312-1
; or later: 311's hybrid compile (custom_sdkconfig, below) fails in SCons.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
; Pin exact versions: a release must be reproducible (docs/firmware/drivers.md).
lib_deps =
  knolleary/PubSubClient @ 2.8
  bblanchon/ArduinoJson @ 7.4.2
  ; ds18b20. OneWire >= 2.3.8 is the first that builds on Arduino core 3.x.
  paulstoffregen/OneWire @ 2.3.8
  milesburton/DallasTemperature @ 4.0.6
; Licenses of everything above: THIRD_PARTY_NOTICES.md. Only permissive ones:
; e.g. the popular DHTesp is GPL-3.0, so the DHT22 driver is our own code.
; Provisioning calls ESP-IDF's network_provisioning directly (src/provisioning.cpp).
; Never let the library finder pull in WiFiProv or the Bluedroid-only Arduino
; BLE libraries: on the ESP32 they'd drag Bluedroid back in.
lib_ignore =
  WiFiProv
  SimpleBLE
  BluetoothSerial
  BLE
build_flags =
  -Wall
; Defines IOD_DRIVER_<ID> for the drivers this chip's build carries (drivers.json "chips").
extra_scripts = pre:driver_flags.py

; NimBLE instead of the prebuilt libraries' Bluedroid + Classic BT: provisioning
; only needs BLE, and Bluedroid alone filled 97% of an OTA slot (firmware/README.md,
; "Size"). This recompiles the framework (the first build is slow; cached after).
[env:esp32]
board = esp32dev
; Turn options off with `=n`, never `# CONFIG_X is not set`: PlatformIO's ini
; parser drops lines starting with # as comments, so those never reach the
; generated sdkconfig.defaults (check it after changing this).
custom_sdkconfig =
  CONFIG_BT_ENABLED=y
  CONFIG_BT_NIMBLE_ENABLED=y
  CONFIG_BT_BLUEDROID_ENABLED=n
  CONFIG_BT_CLASSIC_ENABLED=n
  ; The controller must be BLE-only too. Left on the prebuilt libraries' dual
  ; mode (BTDM), NimBLE's esp_bt_controller_enable(BLE) fails with 0x102 and the
  ; board never advertises ("BLE_INIT: controller enable failed").
  CONFIG_BTDM_CTRL_MODE_BLE_ONLY=y
  CONFIG_BTDM_CTRL_MODE_BR_EDR_ONLY=n
  CONFIG_BTDM_CTRL_MODE_BTDM=n
  ; Normal-priority controller interrupts. With the high-level (level 4) one,
  ; 0.5.1 hung in btdm_controller_task at boot (interrupt watchdog on CPU 0).
  CONFIG_BTDM_CTRL_HLI=n

; Host-side unit tests for the pure parts (pio test -e native). Not a board.
[env:native]
platform = native
framework =
test_framework = unity
lib_deps =
build_flags = -Isrc

[env:esp32c3]
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
; Serial over the C3's own USB, so its log shows without a USB-UART chip.
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-S3 DevKitC-1 (and clones), flashed over its UART port like the ESP32
; DevKits. The partition table is the same 4 MB layout as the other builds.
[env:esp32s3]
board = esp32-s3-devkitc-1

; ESP32-C6 DevKitC-1, flashed over its UART port. Wi-Fi 6 on 2.4 GHz; BLE for phone setup.
; OneWire 2.3.8 doesn't build for the C6, so its build has no DS18B20 (drivers.json
; "chips"): keep the library out, or the dependency finder compiles it anyway.
[env:esp32c6]
board = esp32-c6-devkitc-1
lib_ignore =
  ${env.lib_ignore}
  OneWire
  DallasTemperature

; Lolin S2 Mini: an ESP32-S2, with no Bluetooth (its Wi-Fi is typed in at
; Install) and no USB-UART chip: it flashes and logs over its own USB (the
; board's flags turn on USB CDC at boot).
[env:esp32s2]
board = lolin_s2_mini
