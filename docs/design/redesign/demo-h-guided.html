  .result-count { width: 100%; margin-left: 0; }
}

/* Tables, by column priority; cards below 600 px */
.tbl-wrap { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-card); }
table.tbl { width: 100%; border-collapse: collapse; table-layout: auto; }
.tbl th { text-align: left; font-size: 12.5px; font-weight: 500; color: var(--color-ink-muted); padding: 10px var(--pad-cell); border-bottom: 1px solid var(--color-border); white-space: nowrap; }
.tbl th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
.tbl th button:focus-visible { outline: 2px solid var(--color-accent); }
.tbl td { padding: 10px var(--pad-cell); border-bottom: 1px solid var(--color-border-soft); vertical-align: middle; font-size: var(--fs-sm); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr { cursor: pointer; }
.tbl tbody tr:hover { background: var(--color-row-hover); }
.tbl tbody tr[aria-selected="true"] { background: var(--color-accent-muted); }
.tbl .r { text-align: right; }
.tbl .w-check { width: 40px; }
.tbl .w-menu { width: 44px; }
.cell-name { display: flex; flex-direction: column; min-width: 0; }
.cell-name a, .cell-name b { font-weight: 500; color: var(--color-ink); }
.cell-name .sub { font-size: 12.5px; color: var(--color-ink-muted); }
.cell-name .fold { display: none; }
.tbl tr.is-disabled td { color: var(--color-ink-muted); }
.tbl-foot { display: flex; align-items: center; gap: 12px; padding: 10px var(--pad-cell); border-top: 1px solid var(--color-border); font-size: 12.5px; color: var(--color-ink-muted); flex-wrap: wrap; }
.tbl-foot .grow { text-align: right; }
@container main (max-width: 860px) { .col-p3 { display: none; } .cell-name .fold-p3 { display: inline; } }
@container main (max-width: 720px) { .col-p2 { display: none; } .cell-name .fold-p2 { display: inline; } }
@container main (max-width: 600px) {
  .tbl thead { display: none; }
  .tbl, .tbl tbody, .tbl tr, .tbl td { display: block; width: 100%; }
  .tbl tr { position: relative; padding: 12px 52px 12px 44px; border-bottom: 1px solid var(--color-border-soft); }
  .tbl tr:last-child { border-bottom: 0; }
  .tbl td { padding: 0; border: 0; }
  .tbl td.w-check { position: absolute; left: 14px; top: 14px; width: auto; }
  .tbl td.w-menu { position: absolute; right: 6px; top: 6px; width: auto; }
  .tbl td.c-status { margin-top: 6px; display: inline-block; width: auto; margin-right: 10px; }
  .tbl td.c-seen { display: inline-block; width: auto; color: var(--color-ink-muted); font-size: 12.5px; }
  .tbl td.c-extra { font-size: 12.5px; color: var(--color-ink-muted); margin-top: 2px; }
  .tbl .r { text-align: left; }
  .tbl.no-check tr { padding-left: 16px; }
}
.check { width: 18px; height: 18px; accent-color: var(--color-accent); cursor: pointer; }

/* Tabs: wrap, never scroll sideways; arrow keys move */
.tabs { display: flex; flex-wrap: wrap; gap: 2px 18px; border-bottom: 1px solid var(--color-border); margin-bottom: 24px; }
.tabs [role="tab"] { background: none; border: 0; padding: 10px 0; margin-bottom: -1px; font-size: var(--fs-sm); font-weight: 500; color: var(--color-ink-muted); border-bottom: 2px solid transparent; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; text-decoration: none !important; }
.tabs [role="tab"]:hover { color: var(--color-ink); }
.tabs [role="tab"][aria-selected="true"] { color: var(--color-ink); border-bottom-color: var(--color-accent); }
.tabs [role="tab"] .err-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--color-status-error); }

/* Menus, sheets, dialogs, toasts */
.menu { position: absolute; min-width: 200px; background: var(--color-pop); border: 1px solid var(--color-border); border-radius: 12px; box-shadow: var(--shadow-pop); padding: 6px; z-index: 50; }
.menu [role="menuitem"] { display: flex; width: 100%; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border: 0; background: none; border-radius: 7px; cursor: pointer; font-size: var(--fs-sm); text-align: left; color: var(--color-ink); text-decoration: none !important; }
.menu [role="menuitem"]:hover, .menu [role="menuitem"]:focus { background: var(--color-surface-raised); outline: none; }
.menu .danger { color: var(--color-status-error); }
.menu hr { border: 0; border-top: 1px solid var(--color-border-soft); margin: 6px 0; }
.menu .mi-hint { margin-left: auto; font-size: 12px; color: var(--color-ink-muted); }
.scrim { position: absolute; inset: 0; background: var(--color-scrim); animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
@keyframes slide { from { transform: translateX(24px); opacity: .4; } }
@keyframes rise { from { transform: translateY(24px); opacity: .4; } }
.sheet { position: absolute; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--color-pop); border-left: 1px solid var(--color-border); box-shadow: var(--shadow-pop); display: flex; flex-direction: column; animation: slide .18s; }
.sheet--bottom { top: auto; left: 0; width: 100%; max-height: 85%; border-left: 0; border-top: 1px solid var(--color-border); border-radius: 16px 16px 0 0; animation: rise .18s; }
.sheet-h { display: flex; align-items: center; gap: 8px; padding: 14px 16px 14px 20px; border-bottom: 1px solid var(--color-border-soft); }
.sheet-h h2 { font-size: 17px; font-weight: 600; }
.sheet-b { flex: 1; overflow-y: auto; padding: 20px; container: main / inline-size; }
.sheet-f { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--color-border-soft); justify-content: flex-end; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
.dialog-wrap { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; }
.dialog { width: min(460px, 100%); background: var(--color-pop); border-radius: 16px; box-shadow: var(--shadow-pop); padding: 22px; animation: rise .15s; }
.dialog h2 { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
.dialog p { color: var(--color-ink-muted); font-size: var(--fs-sm); }
.dialog ul { margin: 10px 0 0; padding-left: 18px; font-size: var(--fs-sm); }
.dialog-f { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
.toasts { position: absolute; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; width: min(380px, calc(100% - 32px)); pointer-events: none; }
.toast { pointer-events: auto; background: var(--color-pop); border: 1px solid var(--color-border); border-radius: 12px; box-shadow: var(--shadow-pop); padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; animation: rise .18s; font-size: var(--fs-sm); }
.toast b { display: block; font-weight: 600; }
.toast .detail { color: var(--color-ink-muted); font-size: 13px; }

/* Save bar (sticky inside the scroller) */
.savebar { position: sticky; bottom: 0; z-index: 15; display: flex; align-items: center; gap: 10px; padding: 12px var(--gutter); padding-bottom: max(12px, env(safe-area-inset-bottom)); background: var(--color-surface); border-top: 1px solid var(--color-border); margin-top: 24px; }
.savebar .state { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--color-ink-muted); flex: 1; min-width: 0; }
.savebar .state .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-status-pending); }
.savebar .state.clean .dot { background: var(--color-status-online); }
@container main (max-width: 480px) { .savebar .btn { flex: 1; } .savebar .state { flex-basis: 100%; } .savebar { flex-wrap: wrap; } }

/* Readouts */
.readouts { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.readout { padding: 14px 16px; border: 1px solid var(--color-border); border-radius: 12px; background: var(--color-surface); min-width: 0; }
.readout .r-l { font-size: 13px; color: var(--color-ink-muted); display: flex; align-items: center; gap: 6px; }
.readout .r-v { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.3; }
.readout .r-v small { font-size: 14px; color: var(--color-ink-muted); font-weight: 500; margin-left: 3px; }
.readout .r-s { font-size: 12px; color: var(--color-ink-muted); }
.is-stale { opacity: .6; }

/* Chart */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .axis text { font-size: 11px; fill: var(--color-ink-muted); font-family: var(--mono); }
.chart .grid line { stroke: var(--color-chart-grid); }
.chart-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.chart-h h3 { font-size: 15px; font-weight: 600; }
.chart-note { font-size: 12px; color: var(--color-ink-muted); }

/* Empty state */
.empty { text-align: center; padding: 40px 20px; color: var(--color-ink-muted); }
.empty b { display: block; color: var(--color-ink); font-size: 15px; margin-bottom: 4px; }

/* Shared nav item look (each shell lays them out its own way) */
.nav-group { font-size: 12px; font-weight: 500; color: var(--color-ink-muted); padding: 14px 10px 6px; }
.nav-item { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; color: var(--color-ink); font-size: var(--fs-sm); text-decoration: none !important; white-space: nowrap; }
.nav-item svg { color: var(--color-ink-muted); }
.nav-item:hover { background: var(--color-surface-raised); color: var(--color-ink); }
.nav-item[aria-current="page"] { background: var(--color-accent-muted); color: var(--color-accent-strong); font-weight: 500; }
.nav-item[aria-current="page"] svg { color: var(--color-accent-strong); }
.ws { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; border: 0; background: none; width: 100%; text-align: left; cursor: pointer; }
.ws:hover { background: var(--color-surface-raised); }
.ws-logo { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--color-accent); color: var(--color-on-accent); font-weight: 600; flex-shrink: 0; }
.ws b { display: block; font-size: var(--fs-sm); font-weight: 600; }
.ws small { display: block; font-size: 12px; color: var(--color-ink-muted); }
.kbd { font-family: var(--mono); font-size: 11px; padding: 1px 5px; border-radius: 5px; border: 1px solid var(--color-border); color: var(--color-ink-muted); }
.search-trigger { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--color-border); background: var(--color-input); color: var(--color-ink-muted); width: 100%; cursor: pointer; font-size: 13.5px; }
.live-ind { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-ink-muted); }
.live-ind .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--color-status-online); }
.live-ind.off .dot { background: var(--color-status-pending); }

/* Palette (⌘K) */
.palette { position: absolute; left: 50%; top: 12%; transform: translateX(-50%); width: min(560px, calc(100% - 32px)); background: var(--color-pop); border-radius: 14px; box-shadow: var(--shadow-pop); border: 1px solid var(--color-border); overflow: hidden; animation: rise .15s; }
.palette input { width: 100%; border: 0; border-bottom: 1px solid var(--color-border-soft); padding: 14px 16px; background: none; font-size: 15px; outline: none; }
.palette ul { list-style: none; margin: 0; padding: 6px; max-height: 340px; overflow-y: auto; }
.palette li a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--color-ink); text-decoration: none; font-size: var(--fs-sm); }
.palette li a:hover, .palette li a:focus, .palette li a.on { background: var(--color-surface-raised); outline: none; }
.palette li .pg { margin-left: auto; font-size: 12px; color: var(--color-ink-muted); }

/* Lists of like items (parts, metrics) — one line each, no nested boxes */
.lines { border: 1px solid var(--color-border); border-radius: 12px; background: var(--color-surface); overflow: hidden; }
.line { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--color-border-soft); min-width: 0; width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; font-size: var(--fs-sm); color: var(--color-ink); }
.line:first-child { border-top: 0; }
button.line { cursor: pointer; }
button.line:hover { background: var(--color-row-hover); }
.line .l-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.line .l-main b { font-weight: 500; }
.line .l-main span { font-size: 12.5px; color: var(--color-ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.line .l-end { display: flex; align-items: center; gap: 10px; color: var(--color-ink-muted); font-size: 12.5px; }
.line.has-err { box-shadow: inset 3px 0 0 var(--color-status-error); }
.line-open { padding: 16px; border-top: 1px solid var(--color-border-soft); background: var(--color-surface); }
.icon-err { color: var(--color-status-error); }
.icon-warn { color: var(--color-status-pending); }
.add-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

/* Steps (connect flow, wizard) */
.steps { display: flex; flex-direction: column; gap: 2px; list-style: none; margin: 0; padding: 0; counter-reset: st; }
.steps li { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; font-size: var(--fs-sm); color: var(--color-ink-muted); }
.steps li .n { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--color-border); display: grid; place-items: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }
.steps li[aria-current="step"] { color: var(--color-ink); background: var(--color-accent-muted); }
.steps li[aria-current="step"] .n { border-color: var(--color-accent); color: var(--color-accent-strong); }
.steps li.done .n { background: var(--color-status-online); border-color: var(--color-status-online); color: #fff; }
.steps li .st { margin-left: auto; font-size: 12px; }
.steps-compact { display: none; font-size: 13px; color: var(--color-ink-muted); margin-bottom: 12px; }
.steps-compact b { color: var(--color-ink); }
.progress { height: 6px; border-radius: 99px; background: var(--color-border); overflow: hidden; }
.progress > div { height: 100%; background: var(--color-accent); border-radius: 99px; transition: width .3s; }
.check-line { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--color-border-soft); font-size: var(--fs-sm); }
.check-line:first-child { border-top: 0; }

/* Dashboards */
.dgrid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
.widget { grid-column: span var(--span, 4); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 12px; padding: 14px 16px; min-width: 0; position: relative; box-shadow: var(--shadow-card); }
.widget-h { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; color: var(--color-ink-muted); min-height: 24px; }
.widget-h b { color: var(--color-ink); font-weight: 500; font-size: 13.5px; }
.widget-edit { display: none; gap: 2px; margin-left: auto; }
.editing .widget { outline: 1.5px dashed var(--color-border); outline-offset: 3px; }
.editing .widget-edit { display: flex; }
@container main (max-width: 1000px) { .widget { grid-column: span max(6, var(--span, 4)); } }
@container main (max-width: 640px) { .widget { grid-column: 1 / -1; } }
.gauge-v { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* Mini 24 h strip (rules) */
.strip { display: flex; gap: 1px; height: 14px; width: 144px; max-width: 100%; }
.strip i { flex: 1; border-radius: 1px; background: var(--color-border); }
.strip i.t { background: var(--color-chart); opacity: .55; }
.strip i.f { background: var(--color-accent); }
.strip i.u { background: repeating-linear-gradient(45deg, var(--color-border) 0 2px, transparent 2px 4px); }

/* Code-ish blocks */
.code { font-family: var(--mono); font-size: 12.5px; background: var(--color-surface-raised); border-radius: 8px; padding: 10px 12px; overflow-x: auto; white-space: pre; max-width: 100%; }
.kv { display: grid; grid-template-columns: minmax(110px, max-content) minmax(0, 1fr); gap: 8px 16px; font-size: var(--fs-sm); }
.kv dt { color: var(--color-ink-muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.copy { display: flex; gap: 6px; }
.copy .input { font-family: var(--mono); font-size: 12.5px; }

/* Rule sentence */
.sentence { font-size: 15px; line-height: 1.9; background: var(--color-accent-muted); border-radius: 12px; padding: 14px 16px; }
.sentence .tok { display: inline-flex; padding: 0 7px; border-radius: 6px; background: var(--color-surface); border: 1px solid var(--color-border); font-weight: 500; line-height: 1.6; }
.sentence .kw { font-weight: 600; color: var(--color-accent-strong); }

/* Login */
.auth { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
.auth-card { width: min(400px, 100%); }

/* ---------- Pieces used by shared pages ---------- */
.page--editor { padding-bottom: 0; }
.page--editor .savebar { margin-left: calc(-1 * var(--gutter)); margin-right: calc(-1 * var(--gutter)); }
.bulkbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 12px; margin-bottom: 12px; border-radius: 10px; background: var(--color-accent-muted); font-size: 13px; }
.line[aria-current="true"] { background: var(--color-accent-muted); }
a.line { color: var(--color-ink); }
a.line:hover { background: var(--color-row-hover); }
.readings { display: flex; flex-direction: column; gap: 8px; }
.reading-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.reading-row .r-ch { width: 120px; flex-shrink: 0; font-size: var(--fs-sm); }
.reading-row .input { flex: 1 1 160px; width: auto; }
@container main (max-width: 480px) { .reading-row .r-ch { width: auto; flex: 1; } .reading-row > [aria-hidden] { display: none; } .reading-row .input { flex-basis: 100%; } }
.notif.unread { background: color-mix(in srgb, var(--color-accent-muted) 45%, transparent); }
.unread-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--color-accent); vertical-align: middle; margin-left: 4px; }
.notif .l-end { align-self: center; }
@container main (max-width: 560px) { .notif { flex-wrap: wrap; } .notif .l-end { width: 100%; justify-content: flex-end; } }
.connect { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; align-items: start; }
.connect-nav { position: sticky; top: 16px; }
@container main (max-width: 760px) { .connect { grid-template-columns: minmax(0, 1fr); } .connect-nav { display: none; } .steps-compact { display: block; } }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--color-border); border-top-color: var(--color-accent); animation: spin 1s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.danger-sec .sec-h h2, .danger-sec .sec-h h3 { color: var(--color-status-error); }
@media print { .hz-bar, .side, .rail, .topbar, .tabbar, .ph-actions, .crumbs { display: none !important; } .hz, .frame, .app, .scroller { position: static !important; overflow: visible !important; height: auto !important; } }

/* Fixes after the first screenshot pass */
.kpi > span { display: flex; }
.tabs [role="tab"] { font-family: inherit; }
@container main (max-width: 600px) { .tbl td.col-p2, .tbl td.col-p3 { display: none; } }
.page--editor { min-height: 100%; display: flex; flex-direction: column; }
.page--editor > .savebar, .page--editor > [data-live] > .savebar { margin-top: auto; }
.page--editor > [data-live="savebar"] { display: contents; }
@container main (max-width: 600px) { .ph { flex-wrap: nowrap; } .ph-main { flex-basis: auto; } .ph:has(.ph-actions > :nth-child(3)) { flex-wrap: wrap; } .ph:has(.ph-actions > :nth-child(3)) .ph-main { flex-basis: 100%; } }
@container app (max-width: 640px) { .toasts { left: 12px; right: 12px; width: auto; bottom: 132px; } }
.sheet--left { left: 0; right: auto; border-left: 0; border-right: 1px solid var(--color-border); animation-name: slideL; }
@keyframes slideL { from { transform: translateX(-24px); opacity: .4; } }
/* Demo H — Guided. Icon rail on laptops, full sidebar from 1440 px,
   bottom tab bar on phones. Wizard for creating, tabs for editing. */

.main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.side-wrap { width: 64px; flex-shrink: 0; position: relative; z-index: 30; }
.side { position: absolute; top: 0; bottom: 0; left: 0; width: 64px; background: var(--color-sidebar); border-right: 1px solid var(--color-border); display: flex; flex-direction: column; gap: 6px; padding: 10px 8px; transition: width .15s; }
.side-top { display: flex; flex-direction: column; align-items: center; gap: 6px; }
/* The nav scrolls on short screens; the top and the user block stay pinned. */
.side-nav { display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; margin: 0 -4px; padding: 0 4px; }
.side-top, .side .search-trigger { flex-shrink: 0; }
.side-foot { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 8px; border-top: 1px solid var(--color-border-soft); background: var(--color-sidebar); }
.side .avatar { position: relative; cursor: default; }
.side .avatar .live-dot { position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border-radius: 50%; background: var(--color-status-online); border: 2px solid var(--color-sidebar); }
.side .avatar .live-dot.off { background: var(--color-status-pending); }
.side.is-open .avatar .live-dot { display: none; }
@container app (min-width: 1440px) { .side .avatar .live-dot { display: none; } }
.rail-tip { position: absolute; transform: translateY(-50%); background: var(--color-ink); color: var(--color-canvas); font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; pointer-events: none !important; z-index: 60; }

/* ---------- Usage: what rules and widgets point at a template's keys ---------- */
function usageFor(tplId) {

  const add = (map, k, what) => { map[k] ||= { rules: 0, widgets: 0 }; map[k][what]++; };

const usageText = (x) => (x ? [x.rules && plural(x.rules, "rule"), x.widgets && plural(x.widgets, "widget")].filter(Boolean).join(" and ") : "");

/* ---------- Draft ---------- */
function tplDraft(t) {

const blankDraft = (runsOn = "our", device = null) => ({ name: "", runsOn, enabled: true, board: runsOn === "our" ? "esp32-30" : null, parts: [], metrics: [], actuators: [], device });

}

  return k;
}
function usedPins(d, skipPart) {
  const used = new Set();
  for (const p of d.parts) if (p.uid !== skipPart) for (const v of Object.values(p.pins)) if (v != null) used.add(v);
  if (d.parts.some((p) => DRIVERS[p.driver].i2c)) (I2C_DEFAULT[d.board] || []).forEach((x) => used.add(x));

}
function freePin(d, role, kind, skipPart) {

function attachChannel(d, p, c) {

function addPart(d, driverKey) {

  for (const r of dr.pins || []) p.pins[r.role] = freePin(d, r, dr.kind, p.uid);

/* ---------- Validation (paths match the fields) ---------- */
function validateTpl(d) {

    if (!d.board) E.board = "Pick the board.";
    const used = {};
    if (d.parts.some((p) => DRIVERS[p.driver].i2c)) (I2C_DEFAULT[d.board] || []).forEach((x) => (used[x] = "the I2C bus"));
    for (const p of d.parts) {
      const dr = DRIVERS[p.driver];
      for (const r of dr.pins || []) {
        const pin = p.pins[r.role];
        const path = `parts#${p.uid}.pins.${r.role}`;
        if (pin == null || pin === "") E[path] = "Pick a pin.";
        else if (!(PINS[d.board] || []).includes(pin)) E[path] = `The ${boardName(d.board)} has no ${pinName(pin)}.`;
        else if (used[pin]) E[path] = `${pinName(pin)} is also used by ${used[pin]}.`;
        else if (r.adc && !(ADC1[d.board] || []).includes(pin)) E[path] = "Analog needs an ADC1 pin.";
        else if (dr.kind === "outputs" && (INPUT_ONLY[d.board] || []).includes(pin)) E[path] = `${pinName(pin)} is input-only.`;
        if (pin != null) used[pin] ||= dr.name;

    if (!d.parts.length) W.parts = "No parts yet, so the firmware has nothing to read or switch.";
  }

    for (const r of rows) {

      if (!r.name.trim()) E[p + ".name"] = "Name it.";
      const k = r.key.trim();
      if (!k) E[p + ".key"] = "A key is needed.";
      else if (!/^[a-z0-9][a-z0-9_-]*$/.test(k)) E[p + ".key"] = "Lowercase letters, digits, _ and - only.";
      else if (["status", "config"].includes(k)) E[p + ".key"] = `“${k}” is reserved.`;
      else if (keys[k]) E[p + ".key"] = `Already used by ${keys[k]}.`;

/* ---------- Change summary ---------- */
function tplDiff(a, b) {
  const L = [];
  if (a.name !== b.name) L.push(`Name: ${a.name || "—"} → ${b.name}`);
  if (a.enabled !== b.enabled) L.push(`Status: ${b.enabled ? "Enabled" : "Disabled"}`);
  if (a.board !== b.board) L.push(`Board: ${boardName(a.board)} → ${boardName(b.board)}`);
  const ids = (xs) => xs.map((x) => x.uid);
  for (const p of b.parts) if (!ids(a.parts).includes(p.uid)) L.push(`Added ${DRIVERS[p.driver].name}`);
  for (const p of a.parts) if (!ids(b.parts).includes(p.uid)) L.push(`Removed ${DRIVERS[p.driver].name}`);
  for (const p of b.parts) { const o = a.parts.find((x) => x.uid === p.uid); if (o && JSON.stringify(o) !== JSON.stringify(p)) L.push(`${DRIVERS[p.driver].name}: wiring changed`); }

    const noun = kind === "metrics" ? "Metric" : "Actuator";
    for (const r of b[kind]) {
      const o = a[kind].find((x) => x.uid === r.uid);
      if (!o) L.push(`${noun} ${r.name} added`);
      else {
        if (o.key !== r.key) L.push(`Key ${o.key} → ${r.key}`);
        if (o.name !== r.name) L.push(`${o.name} → ${r.name}`);

/* ---------- Editor wiring for templates (shared by all demos) ---------- */
function openTplEditor({ key, init, tplId, noun, onSet }) {
  return useEditor(key, init, {
    validate: validateTpl,
    isNew: !tplId,
    noun,
    unlocked: new Set(),
    usage: usageFor(tplId),
    onSave: (d, before) => saveTemplate(d, before, tplId),
    onSet(path, v) {
      // A key follows its name until edited (DESIGN §8).
      const m = path.match(/^(metrics|actuators)#(\w+)\.(name|key)$/);
      if (m) {
        const row = getPath(ED.draft, `${m[1]}#${m[2]}`);
        if (m[3] === "key") row.keyAuto = false;
        else if (row.keyAuto) {
          row.key = uniqueKey(ED.draft, keyOf(v), row.uid);
          const el = document.getElementById(fid(`${m[1]}#${m[2]}.key`));
          if (el) el.value = row.key;

      if (path === "device.name" && ED.draft.device && !ED.draft.nameTouched) ED.draft.name = v;
      if (path === "board") for (const p of ED.draft.parts) for (const r of DRIVERS[p.driver].pins || []) if (p.pins[r.role] == null) p.pins[r.role] = freePin(ED.draft, r, DRIVERS[p.driver].kind, p.uid);

Object.assign(ACT, {

  },
  "rm-part": async (el) => {
    const d = ED.draft;

    if (rows.length) {
      const r = await confirmDlg({
        title: `Remove ${esc(DRIVERS[p.driver].name)}?`,
        body: used.length ? `It feeds ${esc(rows.map((x) => x.name).join(", "))}, which rules or dashboards use. Keep them as metrics your firmware publishes, or remove them too.` : `It brings ${esc(rows.map((x) => x.name).join(", "))}. They're removed with it.`,
        confirm: used.length ? "Remove part and data" : "Remove part",
        alt: used.length ? "Keep the metrics" : null,
      });
      if (!r) return;
      keep = r === "alt";
    }
    d.parts = d.parts.filter((x) => x !== p);

    render();

  "replace-part": (el) => {

      title: `Replace ${esc(DRIVERS[p.driver].name)}`,
      sub: "The new part keeps each reading's metric, so rules and dashboards keep working.",
      body: `<div class="lines">${Object.entries(DRIVERS).filter(([k, dr]) => dr.kind === kind && k !== p.driver).map(([k, dr]) => `<button class="line" data-act="replace-with" data-uid="${p.uid}" data-driver="${k}"><span class="l-main"><b>${esc(dr.name)}</b><span>${esc(dr.desc)}</span></span>${ic("chevR", 15)}</button>`).join("")}</div>`,
    });
  },
  "replace-with": (el) => {

    popOv();
    render();
    toast({ title: `${old} replaced by ${DRIVERS[p.driver].name}`, detail: "Its metrics stay." });
  },
  "keep-ch": (el) => {
    const d = ED.draft;
    const p = d.parts.find((x) => x.uid === el.dataset.uid);
    const c = DRIVERS[p.driver].channels.find((x) => x.key === el.dataset.ch);

const qrSvg = (seed) => {

  }

function widgetHtml(db, w) {
  const d = devById(w.device);
  const m = w.metric && metricOf(d, w.metric);
  const title = wTitle(w);
  const r = READINGS[d.id]?.[w.metric];
  const [f] = m ? freshness(d, m, r) : ["Live"];
  let body = "";
  if (w.type === "value") body = `<div class="r-v num ${f === "Stale" ? "is-stale" : ""}" style="font-size:30px;font-weight:600" data-readout="${f === "Live" ? d.id + ":" + w.metric : ""}">${r && r[0] != null ? fmtReading(m, r[0]) : "—"}${unitOf(m) ? `<small class="muted" style="font-size:15px;margin-left:4px">${esc(m.unit)}</small>` : ""}</div><div class="small muted">${f === "Stale" ? `Stale · last value ${agoEl(r?.[1])}` : f === "No data" ? "No data" : agoEl(r?.[1])}</div>`;
  else if (w.type === "status") body = `<div class="stack stack--sm">${devBadge(d.status)}<div class="small muted">Last message ${agoEl(d.seen)}${d.rssi ? ` · ${d.rssi} dBm` : ""}</div></div>`;
  else if (w.type === "actuator") { const st = ACTUATORS[d.id]?.[w.actuator] || {}; body = `<div class="row row--wrap"><span class="grow small">${st.pending ? '<span class="tone-pending">Waiting for confirmation</span>' : `Reports <b>${st.reported == null ? "unknown" : fmtVal(st.reported)}</b>`}</span><div class="seg" role="group" aria-label="Set">${[[true, "On"], [false, "Off"]].map(([v, l]) => `<button aria-pressed="${st.requested === v}" data-act="cmd" data-dev="${d.id}" data-act-key="${w.actuator}" data-val="${v}">${l}</button>`).join("")}</div></div>`; }
  else if (w.type === "gauge") { const v = r?.[0] ?? 0; const lo = m?.min ?? 0, hi = m?.max ?? 100; const a = Math.max(0, Math.min(1, (v - lo) / (hi - lo))); const ang = Math.PI * (1 - a); body = `<svg viewBox="0 0 120 70" width="100%" style="max-width:220px;display:block;margin:0 auto" role="img" aria-label="${esc(m?.name)} ${fmtReading(m, v)} ${esc(unitOf(m))} of ${hi}"><path d="M10 60 A50 50 0 0 1 110 60" fill="none" stroke="var(--color-border)" stroke-width="9" stroke-linecap="round"/><path d="M10 60 A50 50 0 0 1 ${60 + 50 * Math.cos(ang)} ${60 - 50 * Math.sin(ang)}" fill="none" stroke="var(--color-chart)" stroke-width="9" stroke-linecap="round"/></svg><div class="gauge-v" style="text-align:center;margin-top:-14px">${fmtReading(m, v)}<small class="muted" style="font-size:14px"> ${esc(unitOf(m))}</small></div><div class="small muted" style="text-align:center">${lo}–${hi} ${esc(unitOf(m))}</div>`; }
  else if (w.type === "trend") { const rule = { threshold: thresholdFor(d.id, w.metric) }; body = chartHtml(`w-${db.id}-${w.id}`, { dev: d.id, key: w.metric, range: S.range, bool: m?.type === "bool", threshold: rule?.threshold, unit: m?.unit, until: d.status === "online" ? undefined : d.seen, label: `${m?.name} over the last ${S.range}`, h: 170 }); }
  const i = db.widgets.indexOf(w);
  const edit = `<div class="widget-edit"><button class="btn btn--icon btn--sm" data-act="w-move" data-db="${db.id}" data-w="${w.id}" data-dir="-1" aria-label="Move ${esc(title)} earlier" ${i === 0 ? "disabled" : ""}>${ic("chevL", 14)}</button><button class="btn btn--icon btn--sm" data-act="w-move" data-db="${db.id}" data-w="${w.id}" data-dir="1" aria-label="Move ${esc(title)} later" ${i === db.widgets.length - 1 ? "disabled" : ""}>${ic("chevR", 14)}</button><button class="btn btn--icon btn--sm" data-act="w-open" data-db="${db.id}" data-w="${w.id}" aria-label="Edit ${esc(title)}">${ic("edit", 14)}</button><button class="btn btn--icon btn--sm" data-act="w-remove" data-db="${db.id}" data-w="${w.id}" aria-label="Remove ${esc(title)}">${ic("trash", 14)}</button></div>`;
  const editing = dashEditing();
  return `<section class="widget ${editing ? "is-editable" : ""}" style="--span:${w.span}" aria-label="${esc(title)}" ${editing ? `data-act="w-open" data-db="${db.id}" data-w="${w.id}" tabindex="0" role="button"` : ""}><div class="widget-h"><b class="trunc">${esc(title)}</b>${edit}</div>${body}</section>`;
}

Object.assign(ACT, {
  "r-add-leaf": (el) => {
    const d = ED.draft;
    const leaf = newLeaf(d);
    const mode = el.dataset?.mode;
    if (!d.condition) d.condition = leaf;
    else if (el.dataset?.uid) findNode(d.condition, el.dataset.uid)[0].children.push(leaf);
    else if (d.condition.kind === "leaf") d.condition = newGroup(mode || "all", [d.condition, leaf]);
    else if (mode && d.condition.op !== mode) d.condition = newGroup(mode, [d.condition, leaf]);
    else d.condition.children.push(leaf);
    d.condition = normalize(d.condition);
    closeAllOv();
    render();
    setTimeout(() => openLeafSheet(leaf.uid));
  },
  "r-add-group": (el) => {
    const [g] = findNode(ED.draft.condition, el.dataset.uid);
    const ng = newGroup(g.op === "all" ? "any" : "all", [newLeaf(ED.draft), newLeaf(ED.draft)]);
    g.children.push(ng);

    render();
    setTimeout(() => openLeafSheet(ng.children[0].uid));

  "lad-add-leaf": () => ACT["r-add-leaf"]({ dataset: { mode: "all" } }),
  // OR under one contact: a parallel branch to just that contact.
  "lad-or": (el) => {

  "recipe": (el) => { const r = recipesFor(S.recipeDev).find((x) => x.id === el.dataset.id); S.newRule = r ? r.build() : blankRule(S.recipeDev); S.newSeq = (S.newSeq || 0) + 1; navigate("#/rules/new/edit"); },
  "rule-run": async (el) => {

    if (ok === "ok") toast({ title: "Ran once", detail: `${esc(r.draft.name)}: see Activity for what it did.` });

/* ---------- Recipes (rule-recipes.ts) ---------- */
function recipesFor(devId) {
  const dv = devById(devId);
  const t = tplOf(dv);
  const num = t.metrics.filter((m) => m.type === "number");
  const bool = t.metrics.filter((m) => m.type === "bool");
  const acts = DEVICES.filter((x) => tplOf(x).actuators.length);
  const ownAct = t.actuators[0] ? { dev: dv.id, ac: t.actuators[0] } : acts[0] ? { dev: acts[0].id, ac: tplOf(acts[0]).actuators[0] } : null;
  const temp = num.find((m) => /temp/.test(m.key)) || num[0];
  const hum = num.find((m) => /hum/.test(m.key));
  const now = (m) => READINGS[dv.id]?.[m.key]?.[0];
  const leaf = (m, op, value, extra = {}) => ({ uid: uid("l"), kind: "leaf", dev: dv.id, metric: m.key, op, value, low: null, high: null, set: "", rhs: "static", rhsDev: "", rhsMetric: "", hyst: m.type === "bool" ? 0 : 1, ...extra });
  const actuator = (value, revert) => ({ uid: uid("x"), type: "actuator", dev: ownAct.dev, act: ownAct.ac.key, value: ownAct.ac.control === "values" ? firstAllowed(ownAct.ac) : value, revert, clearValue: null });
  const base = (over) => ({ ...blankRule(dv.id), ...over });
  return [
    { id: "too-hot", icon: "zap", title: "Turn something on when it's too hot", desc: `${temp?.name || "A reading"} above a value switches ${ownAct ? actName({ dev: ownAct.dev, act: ownAct.ac.key }) : "an actuator"}, and back when it clears.`, tags: ["switches hardware"], ok: !!temp && !!ownAct, why: "Needs a number reading and something to switch.",
      build: () => base({ condition: leaf(temp, ">", Math.round((now(temp) ?? 25) + 2), { hyst: 2 }), actions: [actuator(true, true)], hold: 10, cooldown: 60, clearDelay: 30 }) },
    { id: "door-open", icon: "mail", title: "Alert when a door stays open", desc: `${bool[0]?.name || "An on/off reading"} On for 2 minutes sends an email.`, tags: ["email"], ok: !!bool.length, why: "Needs an on/off reading.",
      build: () => base({ condition: leaf(bool[0], "==", true), hold: 120, cooldown: 600, actions: [{ uid: uid("x"), type: "email", to: "", subject: `${dv.name}: ${bool[0].name} left On`, body: `${bool[0].name} on ${dv.name} has been On for 2 minutes.` }] }) },
    { id: "humidity-low", icon: "activity", title: "Warn when humidity drops", desc: "Below 40 % posts a notification.", tags: [], ok: !!hum, why: "Needs a humidity reading.",
      build: () => base({ condition: leaf(hum, "<", 40, { hyst: 3 }), hold: 60, cooldown: 900, actions: [{ uid: uid("x"), type: "notification", message: `Humidity on ${dv.name} dropped below 40 %.` }] }) },
    { id: "tank-low", icon: "power", title: "Stop the pump when the tank is low", desc: "Switches off and stays off until someone resets it.", tags: ["switches hardware", "latches"], ok: !!num.length && !!ownAct, why: "Needs a number reading and something to switch.",
      build: () => base({ condition: leaf(num[0], "<", 10, { hyst: 1 }), behaviour: "latch", hold: 5, cooldown: 60, actions: [actuator(false, false)] }) },
    { id: "offline", icon: "wifi", title: "Tell me when this device goes offline", desc: "Its Last-Will posts a notification at once.", tags: [], ok: true,
      build: () => base({ when: { ...blankRule().when, type: "device_status", dev: dv.id, status: "disconnected" }, hold: 0, cooldown: 300, actions: [{ uid: uid("x"), type: "notification", message: `${dv.name} stopped reporting.` }] }) },
    { id: "schedule", icon: "play", title: "Switch something on a schedule", desc: "Every day at 08:00, set an actuator.", tags: ["switches hardware"], ok: !!ownAct, why: "Needs something to switch.",
      build: () => base({ when: { ...blankRule().when, type: "schedule", mode: "daily", cron: "0 8 * * *" }, hold: 0, cooldown: 3600, actions: [actuator(true, false)] }) },
  ];
}

function hWizard({ device, head, pre = "" }) {

  ed.step ??= 0;

  ed.onInvalid = (paths) => { const i = steps.findIndex((s) => paths.some((p) => s[2].includes(sectionOf(p)))); if (i >= 0) ed.step = i; };
  ed.onPartAdded = (p) => setTimeout(() => hOpenPart(p.uid));

  } else if (cur[0] === "data") {

      <div class="wiz-block"><h3>Metrics</h3>${d.metrics.length ? `<div class="lines">${d.metrics.map((m) => rowLine(d, "metrics", m)).join("")}</div>` : `<p class="muted small">None yet.</p>`}<div class="add-row"><button class="btn btn--secondary" data-act="add-row" data-kind="metrics">${ic("plus", 15)}Add metric</button></div></div>
      <div class="wiz-block"><h3>Actuators</h3>${d.actuators.length ? `<div class="lines">${d.actuators.map((a) => rowLine(d, "actuators", a)).join("")}</div>` : `<p class="muted small">None. Add one if the platform should switch something.</p>`}<div class="add-row"><button class="btn btn--secondary" data-act="add-row" data-kind="actuators">${ic("plus", 15)}Add actuator</button></div></div>`;

    const tabs = d.runsOn === "our" ? [["general", "General", ["general"]], ["wiring", "Wiring", ["hardware"]], ["data", "Data", ["metrics", "actuators"]]] : [["general", "General", ["general"]], ["data", "Data", ["metrics", "actuators"]]];
    ed.onInvalid = (paths) => { const tb = tabs.find((x) => x[2].includes(sectionOf(paths[0]))); if (tb) { const q = new URLSearchParams(S.q); q.set("tab", tb[0]); history.replaceState(null, "", `#${S.path}?${q}`); } };
    ed.onPartAdded = (p) => setTimeout(() => hOpenPart(p.uid));
    ed.onRowAdded = (k, r) => setTimeout(() => hOpenRow(k, r.uid));
    let tab = S.q.get("tab") || "general";
    if (!tabs.some((x) => x[0] === tab)) tab = "general";
    const vis = edErrors();
    const n = DEVICES.filter((x) => x.tpl === id).length;
    const tabNav = `<div class="tabs" role="tablist" aria-label="Template sections">${tabs.map(([v, l, secs]) => `<button role="tab" id="ht-${v}" aria-selected="${v === tab}" tabindex="${v === tab ? 0 : -1}" data-act="h-tab" data-val="${v}">${l}${vis.some((p) => secs.includes(sectionOf(p))) ? '<span class="err-dot"></span><span class="sr-only">has problems</span>' : ""}</button>`).join("")}</div>`;
    let body = "";
    if (tab === "general") {
      body = `<section class="sec">${generalFields(d, { isNew: false })}</section><section class="sec"><div class="sec-h"><h2>Runs on</h2></div><p class="muted">${d.runsOn === "our" ? "Our firmware: the board and parts are set in Wiring, and devices install from the browser." : "Custom firmware: you write the firmware; it publishes the metrics listed in Data."}</p></section>`;
    } else if (tab === "wiring") {
      body = `<section class="sec">${boardFields(d)}</section>
        <section class="sec"><div class="sec-h"><h2>Parts</h2><span class="count" style="margin-left:0">${d.parts.length}</span><span class="grow"></span><a class="small" href="#/templates/${id}/wiring">${ic("book", 13)} Wiring guide</a></div><p class="sec-lead">Each part brings its metrics or actuators. Open one to set its pins and name its readings.</p>
          ${d.parts.length ? `<div class="lines">${d.parts.map((p) => partLine(d, p)).join("")}</div>` : `<p class="muted small">No parts yet.</p>`}
          <div class="add-row"><button class="btn btn--secondary" data-act="add-part-open">${ic("plus", 15)}Add part</button></div></section>
        <section class="sec"><div class="sec-h"><h2>What you'll see</h2></div>${live("wys", () => whatYoullSee(ED.draft))}</section>`;
    } else {
      body = `<section class="sec"><div class="sec-h"><h2>Metrics</h2><span class="count" style="margin-left:0">${d.metrics.length}</span></div><p class="sec-lead">What the device publishes. Rules, dashboards and history point at these keys.</p>
          ${d.metrics.length ? `<div class="lines">${d.metrics.map((m) => rowLine(d, "metrics", m)).join("")}</div>` : `<p class="muted small">None yet.</p>`}
          <div class="add-row"><button class="btn btn--secondary" data-act="add-row" data-kind="metrics">${ic("plus", 15)}Add metric</button></div></section>
        <section class="sec"><div class="sec-h"><h2>Actuators</h2><span class="count" style="margin-left:0">${d.actuators.length}</span></div><p class="sec-lead">What the platform can switch.</p>
          ${d.actuators.length ? `<div class="lines">${d.actuators.map((a) => rowLine(d, "actuators", a)).join("")}</div>` : `<p class="muted small">None.</p>`}
          <div class="add-row"><button class="btn btn--secondary" data-act="add-row" data-kind="actuators">${ic("plus", 15)}Add actuator</button></div></section>`;
    }
    const head = ph({
      crumbs: [["Device templates", "#/templates"]],
      over: `Device template · ${t.enabled ? badge(["Enabled", "online", ""]) : badge(["Disabled", "unknown", "sq"])} · ${plural(n, "device")}`,
      title: esc(d.name || t.name),
      desc: tplConsequence(d, id),
      actions: `<button class="btn btn--secondary" data-act="tpl-dup" data-id="${id}">${ic("copy", 14)}Duplicate</button>${menuBtn("tpl", "More actions", `data-id="${id}"`)}`,
    });
    return `<div class="page page--editor">${head}${tabNav}<div class="h-frame">${body}</div>${live("savebar", () => savebar("Save"))}</div>`;
  },
  addDevice() {
    const start = defaultStart();
    const head = ph({ crumbs: [["Devices", "#/devices"]], title: "Add device", desc: start === "tpl" ? "Name it and pick its template. Next come its credential and Install." : "Say what it runs on and what's wired to it. Its template is made for you." });
    if (start === "tpl") {
      fromTemplateEditor();
      return `<div class="page page--editor">${head}<div class="h-frame"><section class="sec">${startChoice(start)}</section><section class="sec">${fromTemplateFields()}</section></div>${live("savebar", () => savebar("Create device"))}</div>`;
    }
    const ed = openTplEditor({ key: "add:new", init: () => blankDraft("our", { name: "", zone: "" }), tplId: null, noun: "the new device" });
    return hWizard({ device: true, head, pre: (ed.step ?? 0) === 0 ? `<div style="margin-bottom:28px">${startChoice(start)}</div>` : "" });
  },
};

boot(CORE_ROUTES);
</script>
</body>
</html>
