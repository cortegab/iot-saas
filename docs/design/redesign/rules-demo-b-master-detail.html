<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rule editor · Demo B</title>
<!--
  Demo B — master–detail in both modes: an overview canvas (summary rows or the rung) and one right panel (Edit · Preview · Checks).
  Self-contained design demo (no build, no backend). Tokens follow docs/design/DESIGN.md §3 and demo G.
  One in-page draft drives both Form and Ladder; edits in one show in the other.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
:root {
  --color-canvas: #f7f7f8; --color-surface: #ffffff; --color-surface-raised: #f2f2f5; --color-border: #e3e3e8; --color-border-soft: #eeeef2;
  --color-ink: #15161a; --color-ink-muted: #62646f;
  --color-accent: #4f46e5; --color-accent-strong: #4338ca; --color-accent-muted: #eef0ff; --color-on-accent: #ffffff;
  --color-chart: #0e7490;
  --color-online: #15803d; --color-pending: #b45309; --color-error: #dc2626; --color-error-surface: #fef2f2; --color-pending-surface: #fffbeb;
  --color-input: #ffffff; --color-row-hover: #f8f8fb;
  --shadow-pop: 0 24px 48px -16px rgba(30,30,60,.22), 0 2px 6px rgba(30,30,60,.08); --shadow-card: 0 1px 2px rgba(30,30,60,.05);
  --dot: rgba(20,20,40,.09);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --color-canvas: #0f1014; --color-surface: #16171c; --color-surface-raised: #1e2027; --color-border: #2a2c34; --color-border-soft: #222329;
    --color-ink: #ececf1; --color-ink-muted: #9a9ca8;
    --color-accent: #818cf8; --color-accent-strong: #a5b4fc; --color-accent-muted: #1f2040; --color-on-accent: #0f1014;
    --color-chart: #22d3ee; --color-online: #4ade80; --color-pending: #fbbf24; --color-error: #f87171; --color-error-surface: #2a1517; --color-pending-surface: #2a2211;
    --color-input: #121318; --color-row-hover: #1a1b21;
    --shadow-pop: 0 24px 48px -16px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.4); --shadow-card: none; --dot: rgba(255,255,255,.07);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --color-canvas: #0f1014; --color-surface: #16171c; --color-surface-raised: #1e2027; --color-border: #2a2c34; --color-border-soft: #222329;
  --color-ink: #ececf1; --color-ink-muted: #9a9ca8;
  --color-accent: #818cf8; --color-accent-strong: #a5b4fc; --color-accent-muted: #1f2040; --color-on-accent: #0f1014;
  --color-chart: #22d3ee; --color-online: #4ade80; --color-pending: #fbbf24; --color-error: #f87171; --color-error-surface: #2a1517; --color-pending-surface: #2a2211;
  --color-input: #121318; --color-row-hover: #1a1b21;
  --shadow-pop: 0 24px 48px -16px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.4); --shadow-card: none; --dot: rgba(255,255,255,.07);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--color-canvas); color: var(--color-ink); font: 14.5px/1.5 "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
.mono { font-family: "Geist Mono", ui-monospace, Menlo, monospace; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

/* demo controls */
.demo { position: fixed; z-index: 50; right: 12px; top: 10px; display: flex; gap: 6px; align-items: center; padding: 6px 8px; border-radius: 10px; background: var(--color-surface); border: 1px dashed var(--color-border); box-shadow: var(--shadow-pop); font-size: 12px; color: var(--color-ink-muted); }
.demo b { color: var(--color-ink); }

/* page */
.page { max-width: 1520px; margin: 0 auto; padding: 28px 40px 0; }
.crumbs { font-size: 13px; color: var(--color-ink-muted); display: flex; gap: 6px; align-items: center; }
.crumbs a { color: inherit; text-decoration: none; } .crumbs b { color: var(--color-ink); font-weight: 500; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-top: 8px; }
.eyebrow { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--color-ink-muted); }
h1 { margin: 4px 0 0; font-size: 30px; line-height: 1.15; letter-spacing: -.025em; font-weight: 600; }
.cons { margin: 6px 0 0; color: var(--color-ink-muted); max-width: 70ch; }
.actions { display: flex; gap: 6px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; background: color-mix(in srgb, var(--color-online) 14%, transparent); color: var(--color-online); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.tag { display: inline-flex; align-items: center; padding: 0 6px; border-radius: 6px; font-size: 11px; font-weight: 600; background: var(--color-surface-raised); color: var(--color-ink-muted); border: 1px solid var(--color-border); }

.btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid transparent; font-weight: 500; cursor: pointer; background: var(--color-accent); color: var(--color-on-accent); white-space: nowrap; }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
.btn.sec { background: var(--color-surface); border-color: var(--color-border); color: var(--color-ink); }
.btn.ghost { background: transparent; color: var(--color-ink-muted); }
.btn.ghost:hover, .btn.sec:hover { background: var(--color-surface-raised); color: var(--color-ink); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon { width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: 8px; border: 0; background: transparent; color: var(--color-ink-muted); cursor: pointer; }
.icon:hover { background: var(--color-surface-raised); color: var(--color-ink); }

/* sentence */
.sentence { margin-top: 18px; padding: 12px 16px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--color-accent) 30%, transparent); background: color-mix(in srgb, var(--color-accent-muted) 60%, transparent); line-height: 2; }
.chip { display: inline; padding: 2px 7px; border-radius: 6px; border: 0; background: var(--color-surface); color: var(--color-accent-strong); font-weight: 600; cursor: pointer; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--color-accent) 25%, transparent); }
.chip.bad { color: var(--color-error); box-shadow: inset 0 0 0 1px var(--color-error); }

.toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin: 14px 0; }
.seg { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--color-surface-raised); border: 1px solid var(--color-border); }
.seg button { border: 0; background: transparent; height: 30px; padding: 0 12px; border-radius: 6px; cursor: pointer; color: var(--color-ink-muted); display: inline-flex; gap: 6px; align-items: center; }
.seg button[aria-pressed="true"] { background: var(--color-surface); color: var(--color-ink); box-shadow: var(--shadow-card); font-weight: 500; }
.recipes { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--color-ink-muted); }
.recipes button { border: 1px solid var(--color-border); background: var(--color-surface); border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 13px; }

/* cards and fields */
.card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 12px; box-shadow: var(--shadow-card); padding: 18px 20px; scroll-margin-top: 16px; }
.card h3 { margin: 0 0 12px; font-size: 15px; display: flex; gap: 8px; align-items: center; letter-spacing: -.01em; }
.card.sel { border-color: var(--color-accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-accent) 18%, transparent); }
.step { width: 20px; height: 20px; display: inline-grid; place-items: center; border-radius: 50%; background: var(--color-accent); color: var(--color-on-accent); font-size: 11px; }
.lead { margin: -6px 0 12px; font-size: 13px; color: var(--color-ink-muted); }
.fields { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field > span { font-size: 12.5px; font-weight: 500; color: var(--color-ink-muted); }
.field input, .field select { height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--color-border); background: var(--color-input); min-width: 0; width: 100%; }
.field input[aria-invalid="true"] { border-color: var(--color-error); }
.field small { font-size: 12px; color: var(--color-ink-muted); }
.field small.err { color: var(--color-error); }
.sub { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--color-border-soft); }
.sub-h { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--color-ink-muted); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.linkbtn { border: 0; background: none; color: var(--color-accent); cursor: pointer; padding: 0; font-size: 13px; font-weight: 500; }
.linkbtn.danger { color: var(--color-error); }
.switch { display: flex; gap: 10px; align-items: center; }
.switch input { width: 36px; height: 20px; accent-color: var(--color-accent); }

/* ladder */
.ladder { position: relative; border: 1px solid var(--color-border); border-radius: 12px; background: var(--color-surface) radial-gradient(var(--dot) 1px, transparent 1px) 0 0 / 14px 14px; padding: 18px 16px; overflow-x: auto; box-shadow: var(--shadow-card); }
.rung { display: flex; align-items: center; min-width: max-content; padding: 26px 0 8px; position: relative; }
.rung::before, .rung::after { content: ""; position: absolute; top: 0; bottom: 0; width: 3px; background: var(--color-ink); border-radius: 2px; }
.rung::before { left: 0; } .rung::after { right: 0; }
.wire { height: 2px; background: var(--color-ink-muted); flex: 0 0 22px; }
.wire.grow { flex: 1 1 40px; }
.el { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 110px; padding: 6px 10px; border-radius: 10px; border: 1.5px solid transparent; background: transparent; cursor: pointer; }
.el:hover { background: var(--color-row-hover); }
.el.sel { border-color: var(--color-accent); background: color-mix(in srgb, var(--color-accent-muted) 70%, transparent); }
.el .sym { font-family: "Geist Mono", monospace; font-size: 18px; letter-spacing: -1px; color: var(--color-ink); }
.el b { font-size: 12.5px; font-weight: 600; } .el small { font-size: 11px; color: var(--color-ink-muted); font-family: "Geist Mono", monospace; }
.el.bad .sym, .el.bad b { color: var(--color-error); }
.trig { position: absolute; top: 0; left: 12px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-surface); cursor: pointer; }
.trig.sel { border-color: var(--color-accent); color: var(--color-accent-strong); }
.addc { width: 26px; height: 26px; border-radius: 50%; border: 1.5px dashed var(--color-accent); background: var(--color-surface); color: var(--color-accent); cursor: pointer; flex: none; }
.ladder-legend { margin-top: 10px; font-size: 12px; color: var(--color-ink-muted); display: flex; flex-wrap: wrap; gap: 14px; }
.ladder-legend .mono { color: var(--color-ink); }

/* preview */
.pv { display: flex; flex-direction: column; gap: 12px; }
.pv h4 { margin: 0 0 6px; font-size: 13px; }
.strip { display: grid; grid-template-columns: repeat(48, 1fr); gap: 1px; height: 22px; }
.strip i { background: var(--color-surface-raised); border-radius: 1px; }
.strip i.t { background: color-mix(in srgb, var(--color-accent) 35%, transparent); }
.strip i.f { background: var(--color-accent); }
.axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--color-ink-muted); font-family: "Geist Mono", monospace; margin-top: 3px; }
.send { font-family: "Geist Mono", monospace; font-size: 12px; line-height: 1.6; word-break: break-all; }
.send span { color: var(--color-ink-muted); }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.checks li { display: flex; gap: 8px; align-items: flex-start; }
.checks li::before { content: "✓"; color: var(--color-online); font-weight: 700; }
.checks li.bad::before { content: "!"; color: var(--color-error); width: 10px; text-align: center; }
.checks li.bad button { color: var(--color-error); }
.checks small { display: block; color: var(--color-ink-muted); font-size: 12px; }
.warn { padding: 8px 10px; border-radius: 8px; background: var(--color-pending-surface); color: var(--color-pending); font-size: 12.5px; }

/* save bar */
.savebar { position: sticky; bottom: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); margin-top: 16px; border-top: 1px solid var(--color-border); background: color-mix(in srgb, var(--color-canvas) 92%, transparent); backdrop-filter: blur(10px); }
.savebar .state { flex: 1; font-size: 13px; color: var(--color-ink-muted); display: flex; gap: 10px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-pending); display: inline-block; margin-right: 6px; }
.fix { border: 0; border-radius: 999px; padding: 3px 10px; background: var(--color-error-surface); color: var(--color-error); font-weight: 600; font-size: 12.5px; cursor: pointer; }
.toast { position: fixed; right: 16px; bottom: 132px; z-index: 60; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 12px; box-shadow: var(--shadow-pop); padding: 10px 14px; font-size: 13px; max-width: 320px; }
.toast b { display: block; }

@media (max-width: 760px) {
  .page { padding: 16px 16px 0; }
  h1 { font-size: 24px; }
  .demo { top: auto; bottom: 72px; right: 8px; flex-wrap: wrap; max-width: calc(100vw - 16px); }
}

/* Demo B: overview canvas | one right panel (Edit · Preview · Checks) */
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; align-items: start; }
.canvas { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.rows { display: flex; flex-direction: column; border: 1px solid var(--color-border); border-radius: 12px; background: var(--color-surface); box-shadow: var(--shadow-card); overflow: hidden; }
.row { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 16px; border: 0; border-bottom: 1px solid var(--color-border-soft); background: transparent; text-align: left; cursor: pointer; }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--color-row-hover); }
.row.on { background: var(--color-accent-muted); box-shadow: inset 3px 0 0 var(--color-accent); }
.row .k { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--color-ink-muted); display: flex; gap: 6px; align-items: center; }
.row .v { font-size: 14px; min-width: 0; }
.row .v small { display: block; color: var(--color-ink-muted); font-size: 12px; }
.row .end { display: flex; gap: 8px; align-items: center; color: var(--color-ink-muted); }
.row.add { grid-template-columns: 96px 1fr; color: var(--color-accent); font-weight: 500; font-size: 13px; padding: 10px 16px; }
.badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--color-error); color: #fff; font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; }
.okmark { color: var(--color-online); font-weight: 700; }
.step { width: 18px; height: 18px; font-size: 10.5px; }
.namerow { margin-top: 10px; }
.panel { position: sticky; top: 16px; display: flex; flex-direction: column; max-height: calc(100vh - 110px); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 12px; box-shadow: var(--shadow-card); overflow: hidden; }
.tabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--color-border); }
.tabs button { border: 0; background: transparent; padding: 8px 12px; cursor: pointer; color: var(--color-ink-muted); border-bottom: 2px solid transparent; display: inline-flex; gap: 6px; align-items: center; font-weight: 500; }
.tabs button[aria-selected="true"] { color: var(--color-ink); border-bottom-color: var(--color-accent); }
.panel-body { padding: 16px 18px 20px; overflow: auto; }
.panel-body .crumb { font-family: "Geist Mono", monospace; font-size: 12px; color: var(--color-ink-muted); }
.panel-body h3 { margin: 2px 0 14px; font-size: 16px; }
.panel-body .fields { grid-template-columns: 1fr 1fr; }
.panel-body .fields .field.full { grid-column: 1 / -1; }
@media (max-width: 1100px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .panel { position: static; max-height: none; }
  .row { grid-template-columns: 70px minmax(0, 1fr) auto; }
}

</style>
</head>
<body>
<div id="app"></div>
<script>
// ===== shared core: one draft, one set of fields, both modes =====
const DEVICES = { "bay1-climate": ["temperature", "humidity"], "pump-house": ["tank", "pressure"] };
const ACTUATORS = { "bay1-climate": ["fan1", "vent"], "pump-house": ["pump1"] };
const UNITS = { temperature: "°C", humidity: "%", tank: "%", pressure: "bar" };
const SAVED = () => ({
  when: "reading", schedule: "07:00",
  contacts: [{ device: "bay1-climate", metric: "temperature", op: ">", value: 30, hyst: 2 }],
  hold: 10, cooldown: 60,
  action: { device: "bay1-climate", actuator: "fan1", on: true },
  clearBack: true, name: "Too hot → fan on", enabled: true,
});
const BLANK = () => ({ ...SAVED(), contacts: [{ device: "bay1-climate", metric: "temperature", op: ">", value: "", hyst: 0 }], hold: 0, cooldown: 0, name: "" });
const RECIPES = {
  "Too hot → fan on": SAVED,
  "Tank low → pump on": () => ({ ...SAVED(), contacts: [{ device: "pump-house", metric: "tank", op: "<", value: 20, hyst: 5 }], action: { device: "pump-house", actuator: "pump1", on: true }, name: "Tank low → pump on" }),
};

let D = SAVED();
const view = { mode: "form", sel: "when", isNew: false, dirty: false };
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

const SECTIONS = [
  ["when", "When", "Trigger"],
  ["if", "If", "Conditions"],
  ["then", "Then", "Actions"],
  ["behaviour", "Behaviour", "Hold, cooldown, clear"],
  ["name", "Name", "Name and status"],
];
const secOf = (sel) => sel.split(":")[0];

// ---- validation: the checks the preview lists and the rail / tabs count ----
function problems() {
  const out = [];
  D.contacts.forEach((c, i) => {
    if (c.value === "" || isNaN(Number(c.value))) out.push({ sec: "if", sel: `if:${i}`, text: `Condition ${i + 1} needs a number`, k: `contacts.${i}.value` });
    else if (!(Number(c.hyst) > 0)) out.push({ sec: "behaviour", sel: `if:${i}`, text: "Hysteresis above 0", hint: "Without it a noisy reading near the threshold flips the relay.", k: `contacts.${i}.hyst` });
  });
  if (D.when === "reading" && Number(D.hold) < 5) out.push({ sec: "behaviour", sel: "behaviour", text: "Hold for at least 5 s", hint: "A single noisy reading could fire it.", k: "hold" });
  if (Number(D.cooldown) < 30) out.push({ sec: "behaviour", sel: "behaviour", text: "Minimum interval of at least 30 s", hint: "It could fire again seconds after the last time.", k: "cooldown" });
  if (!D.name.trim()) out.push({ sec: "name", sel: "name", text: "Give the rule a name", k: "name" });
  return out;
}
const PASSES = ["Conditions complete", "Actions complete", "Hold, interval and hysteresis protect the relay"];
const errFor = (k) => problems().find((p) => p.k === k);

// ---- fields: the same renderer feeds a form section and the inspector ----
function sel(k, value, options) {
  return `<select data-k="${k}">${options.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(value) ? " selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
}
function field(label, k, control, { full = false, hint = "" } = {}) {
  const e = errFor(k);
  return `<label class="field${full ? " full" : ""}"><span>${label}</span>${control}<small data-hint="${esc(hint)}"${e ? ' class="err"' : ""}>${e ? esc(e.text) : hint}</small></label>`;
}
/** Error lines and aria-invalid follow the draft without re-rendering inputs. */
function syncErrors() {
  $$(".field [data-k]").forEach((el) => {
    const small = el.closest(".field").querySelector("small");
    const e = errFor(el.dataset.k);
    if (e) el.setAttribute("aria-invalid", "true"); else el.removeAttribute("aria-invalid");
    if (!small) return;
    small.className = e ? "err" : "";
    small.textContent = e ? e.text : small.dataset.hint;
  });
}
const num = (k, v, extra = "") => `<input type="number" data-k="${k}" value="${esc(v)}" ${extra}${errFor(k) ? ' aria-invalid="true"' : ""}>`;

function fieldsFor(s) {
  const sec = secOf(s);
  if (sec === "when") {
    return `<div class="fields">${field("Run", "when", sel("when", D.when, [["reading", "On every reading"], ["schedule", "On a schedule"]]))}${D.when === "schedule" ? field("Every day at", "schedule", `<input data-k="schedule" value="${esc(D.schedule)}">`, { hint: "Workspace time zone: Europe/Madrid" }) : ""}</div>`;
  }
  if (sec === "if") {
    const idx = s.includes(":") ? [Number(s.split(":")[1])] : D.contacts.map((_, i) => i);
    return idx.map((i) => {
      const c = D.contacts[i];
      if (!c) return "";
      return `<div class="${idx.length > 1 && i > 0 ? "sub" : ""}">
        ${idx.length > 1 ? `<div class="sub-h">Condition ${i + 1}${i > 0 ? ` <button class="linkbtn danger" data-act="rmc" data-i="${i}">Remove</button>` : ""}</div>` : ""}
        <div class="fields">
          ${field("Device", `contacts.${i}.device`, sel(`contacts.${i}.device`, c.device, Object.keys(DEVICES).map((d) => [d, d])))}
          ${field("Metric", `contacts.${i}.metric`, sel(`contacts.${i}.metric`, c.metric, DEVICES[c.device].map((m) => [m, m])))}
          ${field("Is", `contacts.${i}.op`, sel(`contacts.${i}.op`, c.op, [[">", "above"], ["<", "below"], [">=", "at least"], ["<=", "at most"]]))}
          ${field(`Value (${UNITS[c.metric]})`, `contacts.${i}.value`, num(`contacts.${i}.value`, c.value, 'step="0.5"'))}
          ${field(`Hysteresis (${UNITS[c.metric]})`, `contacts.${i}.hyst`, num(`contacts.${i}.hyst`, c.hyst, 'step="0.5" min="0"'), { hint: `Re-arms at ${rearmAt(c)}` })}
        </div></div>`;
    }).join("") + (s === "if" || idx.length === D.contacts.length ? `<div class="sub" style="border:0;padding-top:4px"><button class="linkbtn" data-act="addc">+ Add a condition (and)</button></div>` : "");
  }
  if (sec === "then") {
    const a = D.action;
    return `<div class="fields">
      ${field("Device", "action.device", sel("action.device", a.device, Object.keys(ACTUATORS).map((d) => [d, d])))}
      ${field("Actuator", "action.actuator", sel("action.actuator", a.actuator, ACTUATORS[a.device].map((x) => [x, x])))}
      ${field("Set to", "action.on", sel("action.on", String(a.on), [["true", "On"], ["false", "Off"]]))}
      <label class="field full switch"><input type="checkbox" data-k="clearBack"${D.clearBack ? " checked" : ""}> <span style="font-size:14px;color:var(--color-ink)">Turn it back ${a.on ? "off" : "on"} when the condition clears</span></label>
    </div>`;
  }
  if (sec === "behaviour") {
    return `<div class="fields">
      ${D.when === "reading" ? field("Hold time (s)", "hold", num("hold", D.hold, 'min="0"'), { hint: "Ignore brief spikes." }) : ""}
      ${field("Minimum interval (s)", "cooldown", num("cooldown", D.cooldown, 'min="0"'), { hint: "Shortest time between firings." })}
    </div>`;
  }
  return `<div class="fields">
    ${field("Rule name", "name", `<input data-k="name" value="${esc(D.name)}" placeholder="e.g. Too hot → fan on"${errFor("name") ? ' aria-invalid="true"' : ""}>`, { full: true })}
    <label class="field full switch"><input type="checkbox" data-k="enabled"${D.enabled ? " checked" : ""}> <span style="font-size:14px;color:var(--color-ink)">${D.enabled ? "Enabled: fires when its trigger and conditions are met" : "Disabled: keeps its settings, won't fire"}</span></label>
  </div>`;
}
function rearmAt(c) {
  const v = Number(c.value), h = Number(c.hyst) || 0;
  if (isNaN(v)) return "—";
  return `${c.op.startsWith(">") ? v - h : v + h} ${UNITS[c.metric]}`;
}
const contactText = (c) => `${c.metric} ${c.op} ${c.value === "" ? "?" : c.value} ${UNITS[c.metric]}`;
const actionText = () => `${D.action.actuator} ${D.action.on ? "on" : "off"}`;

// ---- sentence ----
function sentenceHTML() {
  const chip = (s, text) => `<button class="chip${problems().some((p) => p.sel === s || (s === "behaviour" && p.sec === "behaviour" && p.sel === "behaviour")) ? " bad" : ""}" data-sel="${s}">${esc(text)}</button>`;
  return `When ${chip("when", D.when === "reading" ? "a reading arrives" : `every day at ${D.schedule}`)}, if ${D.contacts.map((c, i) => chip(`if:${i}`, `${contactText(c)} on ${c.device}`)).join(" and ")}${D.when === "reading" ? ` for ${chip("behaviour", `${D.hold || 0} s`)}` : ""}, ${chip("then", `turn ${actionText()}`)}${D.clearBack ? `; when that's no longer true, turn it back ${D.action.on ? "off" : "on"}` : ""}.`;
}

// ---- preview: replay, would send, checks ----
function series(metric) {
  const base = { temperature: 27, humidity: 62, tank: 35, pressure: 2.2 }[metric];
  const amp = { temperature: 4.5, humidity: 12, tank: 25, pressure: 0.6 }[metric];
  return Array.from({ length: 48 }, (_, i) => base + amp * Math.sin(i / 4.2) + amp * 0.25 * Math.sin(i * 1.7));
}
function replay() {
  const cs = D.contacts.map((c) => ({ c, s: series(c.metric) }));
  let armed = true, last = -99, fired = 0;
  const cells = [];
  for (let i = 0; i < 48; i++) {
    const ok = cs.every(({ c, s }) => { const v = Number(c.value); return c.op.startsWith(">") ? s[i] > v : s[i] < v; });
    const clear = cs.some(({ c, s }) => { const v = Number(c.value), h = Number(c.hyst) || 0; return c.op.startsWith(">") ? s[i] < v - h : s[i] > v + h; });
    if (!armed && clear) armed = true;
    const cool = (i - last) * 1800 >= Number(D.cooldown);
    if (ok && armed && cool) { cells.push("f"); fired++; last = i; if (Number(cs[0].c.hyst) > 0) armed = false; }
    else cells.push(ok ? "t" : "");
  }
  return { cells, fired };
}
function previewHTML({ checks = true } = {}) {
  const r = replay(), p = problems();
  const base = `io-driven/${D.action.device}/cmd/${D.action.actuator}`;
  return `<div class="pv">
    <section><h4>Last 24 hours</h4><div class="strip">${r.cells.map((c) => `<i class="${c}"></i>`).join("")}</div><div class="axis"><span>24 h ago</span><span>now</span></div>
      <p style="margin:6px 0 0;font-size:13px">${r.fired ? `Would have fired <b>${r.fired}×</b>.` : "Wouldn't have fired."}</p>
      ${r.fired > 6 ? `<p class="warn">Noisy: raise the hold time or hysteresis.</p>` : ""}</section>
    <section><h4>Would send</h4><div class="send"><span>command</span><br>${base}<br>{"value":${D.action.on},"ttl":30}${D.clearBack ? `<br><span>when it clears</span><br>${base}<br>{"value":${!D.action.on},"ttl":30}` : ""}</div></section>
    ${checks ? `<section><h4>Checks</h4>${checksHTML(p)}</section>` : ""}
    <section><h4>Other rules on ${esc(D.action.actuator)}</h4><p style="margin:0;font-size:13px;color:var(--color-ink-muted)">${D.action.actuator === "fan1" ? "“Night ventilation” also switches fan1." : "No other enabled rule drives it."}</p></section>
  </div>`;
}
function checksHTML(p = problems()) {
  return `<ul class="checks">${p.map((x) => `<li class="bad"><span><button class="linkbtn" data-sel="${x.sel}" data-focus="${x.k}">${esc(x.text)}</button>${x.hint ? `<small>${esc(x.hint)}</small>` : ""}</span></li>`).join("")}${PASSES.slice(0, Math.max(1, 3 - p.length)).map((t) => `<li>${t}</li>`).join("")}</ul>`;
}

// ---- the rung ----
function rungHTML() {
  const bad = (s) => problems().some((p) => p.sel === s);
  const els = D.contacts.map((c, i) => `<div class="wire"></div><button class="el${view.sel === `if:${i}` ? " sel" : ""}${bad(`if:${i}`) ? " bad" : ""}" data-sel="if:${i}"><b>${esc(contactText(c))}</b><span class="sym">─┤ ├─</span><small>${c.device}</small></button>`).join("");
  return `<div class="ladder"><div class="rung">
      <button class="trig${view.sel === "when" ? " sel" : ""}" data-sel="when">⚡ ${D.when === "reading" ? "On reading" : `Daily ${esc(D.schedule)}`}</button>
      ${els}<div class="wire"></div><button class="addc" data-act="addc" title="Add a condition in series" aria-label="Add a condition in series">+</button>
      ${D.when === "reading" ? `<div class="wire"></div><button class="el${view.sel === "behaviour" ? " sel" : ""}${bad("behaviour") ? " bad" : ""}" data-sel="behaviour"><b>TON ${D.hold || 0} s</b><span class="sym">─[⏱]─</span><small>cool ${D.cooldown || 0} s</small></button>` : ""}
      <div class="wire grow"></div>
      <button class="el${view.sel === "then" ? " sel" : ""}" data-sel="then"><b>${esc(actionText())}</b><span class="sym">─( ${D.clearBack ? " " : "P"} )─</span><small>${D.action.device}</small></button>
      <div class="wire"></div>
    </div></div>
    <div class="ladder-legend"><span><span class="mono">─┤ ├─</span> condition</span><span><span class="mono">─[⏱]─</span> hold timer</span><span><span class="mono">( )</span> turns back when cleared</span><span><span class="mono">(P)</span> set only</span><span>Series = all must be true.</span></div>`;
}

// ---- header + savebar ----
function headerHTML() {
  const devs = new Set(D.contacts.map((c) => c.device)).size;
  return view.isNew
    ? `<nav class="crumbs"><a href="#">Rules</a> › <b>New rule</b></nav>
       <div class="head"><div><div class="eyebrow">New rule</div><h1 id="title">${esc(D.name || "New rule")}</h1>
       <p class="cons">Nothing runs until you create it. It will watch ${devs} device${devs > 1 ? "s" : ""} and can switch 1 actuator.</p></div>
       <div class="actions"><button class="icon" aria-label="Close">✕</button></div></div>`
    : `<nav class="crumbs"><a href="#">Rules</a> › <b>${esc(D.name || "Rule")}</b></nav>
       <div class="head"><div><div class="eyebrow">Rule · <span class="pill">${D.enabled ? "Armed" : "Disabled"}</span> Fired 3 h ago</div><h1 id="title">${esc(D.name || "Untitled rule")}</h1>
       <p class="cons">Saving applies within a second. It watches ${devs} device${devs > 1 ? "s" : ""} and can switch 1 actuator.</p></div>
       <div class="actions"><button class="btn sec sm">Duplicate</button><button class="icon" aria-label="More">⋮</button><button class="icon" aria-label="Close">✕</button></div></div>`;
}
function savebarHTML() {
  const n = problems().length;
  return `<div class="state">${view.dirty ? '<span><span class="dot"></span>Unsaved changes</span>' : view.isNew ? "<span>New rule, not created yet</span>" : '<span style="color:var(--color-online)">✓ All changes saved</span>'}
    ${n ? `<button class="fix" data-act="nextfix">! ${n} to fix</button>` : ""}</div>
    <button class="btn ghost" data-act="discard"${view.dirty ? "" : " disabled"}>Discard</button>
    <button class="btn" data-act="save"${view.dirty || view.isNew ? "" : " disabled"}>${view.isNew ? "Create rule" : "Save changes"}</button>`;
}

// ---- events ----
function setPath(path, raw, el) {
  const parts = path.split(".");
  let o = D;
  for (const p of parts.slice(0, -1)) o = o[p];
  const last = parts.at(-1);
  let v = el.type === "checkbox" ? el.checked : raw;
  if (el.type === "number") v = raw === "" ? "" : Number(raw);
  if (path === "action.on") v = raw === "true";
  o[last] = v;
  if (last === "device" && parts[0] === "contacts") o.metric = DEVICES[v][0];
  if (last === "device" && parts[0] === "action") o.actuator = ACTUATORS[v][0];
}
function toast(title, detail) {
  $$(".toast").forEach((t) => t.remove());
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = `<b>${esc(title)}</b>${detail ? esc(detail) : ""}`;
  document.body.append(t);
  setTimeout(() => t.remove(), 2600);
}
document.addEventListener("input", (e) => {
  const el = e.target.closest("[data-k]");
  if (!el) return;
  setPath(el.dataset.k, el.value, el);
  view.dirty = true;
  // Structure-changing fields re-render their own fields; typing keeps focus.
  if (el.tagName === "SELECT" || el.type === "checkbox") LAYOUT.render(); else LAYOUT.refresh();
});
document.addEventListener("click", (e) => {
  const s = e.target.closest("[data-sel]");
  if (s) { select(s.dataset.sel, s.dataset.focus); return; }
  const a = e.target.closest("[data-act]");
  if (!a) return;
  const act = a.dataset.act;
  if (act === "addc") { D.contacts.push({ device: "bay1-climate", metric: "humidity", op: ">", value: 80, hyst: 3 }); view.dirty = true; select(`if:${D.contacts.length - 1}`); }
  if (act === "rmc") { D.contacts.splice(Number(a.dataset.i), 1); view.dirty = true; select("if:0"); }
  if (act === "mode") { view.mode = a.dataset.v; LAYOUT.render(); }
  if (act === "isnew") { view.isNew = a.dataset.v === "1"; D = view.isNew ? BLANK() : SAVED(); view.dirty = false; view.sel = "when"; LAYOUT.render(); }
  if (act === "recipe") { D = RECIPES[a.dataset.v](); view.dirty = true; LAYOUT.render(); toast("Recipe applied", "Every field stays editable."); }
  if (act === "theme") { const r = document.documentElement; r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark"; }
  if (act === "discard") { D = view.isNew ? BLANK() : SAVED(); view.dirty = false; LAYOUT.render(); }
  if (act === "save" || act === "nextfix") {
    const p = problems();
    if (p.length) { select(p[0].sel, p[0].k); if (act === "save") toast(`${p.length} to fix`, "Moved you to the first one."); return; }
    view.dirty = false; LAYOUT.refresh(); toast(view.isNew ? "Rule created" : "Rule saved", view.isNew ? "" : "1 change. Version 4.");
  }
});
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); $('[data-act="save"]')?.click(); }
});
function select(s, focusKey) {
  view.sel = s;
  LAYOUT.select(s);
  if (focusKey) setTimeout(() => $(`[data-k="${focusKey}"]`)?.focus(), 60);
}
function demoBar(label) {
  return `<div class="demo" role="group" aria-label="Demo controls"><b>${label}</b>
    <div class="seg"><button data-act="isnew" data-v="0" aria-pressed="${!view.isNew}">Edit</button><button data-act="isnew" data-v="1" aria-pressed="${view.isNew}">New</button></div>
    <button class="btn sec sm" data-act="theme">Theme</button></div>`;
}
function modeToggle() {
  return `<div class="seg" role="group" aria-label="Editor view"><button data-act="mode" data-v="form" aria-pressed="${view.mode === "form"}">Form</button><button data-act="mode" data-v="ladder" aria-pressed="${view.mode === "ladder"}">Ladder <span class="tag">expert</span></button></div>`;
}
function recipesHTML() {
  return view.isNew ? `<div class="recipes">Start from: ${Object.keys(RECIPES).map((r) => `<button data-act="recipe" data-v="${esc(r)}">${esc(r)}</button>`).join("")}</div>` : "<span></span>";
}

// ===== Demo B: master–detail in both modes =====
// The canvas is always an overview you select from: summary rows (Form) or
// the rung (Ladder). The right panel is identical in both: Edit · Preview ·
// Checks. Switching mode keeps the selection, so you edit the same thing in
// the same place.
let tab = "edit";

function rowState(sel, sec) {
  const n = problems().filter((p) => (sel ? p.sel === sel : p.sec === sec)).length;
  return n ? `<span class="badge">${n}</span>` : view.isNew ? `<span class="okmark">✓</span>` : "";
}
function row(sel, key, value, sub, step) {
  return `<button class="row${view.sel === sel ? " on" : ""}" data-sel="${sel}"><span class="k">${view.isNew && step ? `<span class="step">${step}</span>` : ""}${key}</span><span class="v">${value}${sub ? `<small>${sub}</small>` : ""}</span><span class="end">${rowState(sel)}›</span></button>`;
}
function formCanvas() {
  const c = D.contacts;
  return `<div class="rows">
    ${row("when", "When", D.when === "reading" ? "A reading arrives" : `Every day at ${esc(D.schedule)}`, D.when === "reading" ? "Evaluated in memory, the moment it lands" : "Workspace time zone", 1)}
    ${c.map((x, i) => row(`if:${i}`, i ? "And" : "If", `${esc(x.device)} · ${esc(contactText(x))}`, `re-arms at ${rearmAt(x)}`, i ? 0 : 2)).join("")}
    <button class="row add" data-act="addc"><span></span><span>+ Add a condition (and)</span></button>
    ${row("then", "Then", `Turn ${esc(D.action.device)} · ${esc(actionText())}`, D.clearBack ? `back ${D.action.on ? "off" : "on"} when it clears` : "set only", 3)}
    ${row("behaviour", "Behaviour", `${D.when === "reading" ? `Hold ${D.hold || 0} s · ` : ""}interval ${D.cooldown || 0} s`, "Protects the relay from flapping", 4)}
    ${row("name", "Name", esc(D.name || "Untitled"), D.enabled ? "Enabled" : "Disabled", 5)}
  </div>`;
}
function ladderCanvas() {
  return `${rungHTML()}<div class="rows namerow">${row("name", "Rule", esc(D.name || "Untitled"), D.enabled ? "Enabled" : "Disabled", 5)}</div>`;
}
function editHTML() {
  const s = view.sel, sec = secOf(s);
  const title = { when: "Trigger", if: `Condition ${Number(s.split(":")[1] ?? 0) + 1}`, then: "Action", behaviour: "Behaviour", name: "Name and status" }[sec];
  const crumb = view.mode === "ladder" ? { when: "Rung › Trigger", if: "Rung › Series › Contact", then: "Rung › Coil", behaviour: "Rung › Timer", name: "Rule" }[sec] : { when: "When", if: "If", then: "Then", behaviour: "Behaviour", name: "Name" }[sec];
  return `<div class="crumb">${crumb}</div><h3>${title}</h3>${fieldsFor(s)}`;
}
function panelHTML() {
  const n = problems().length;
  const t = (id, label, extra = "") => `<button role="tab" aria-selected="${tab === id}" data-tab="${id}">${label}${extra}</button>`;
  return `<div class="tabs" role="tablist">${t("edit", "Edit")}${t("preview", "Preview", ` <small style="color:var(--color-ink-muted);font-weight:400">${replay().fired}×</small>`)}${t("checks", "Checks", n ? ` <span class="badge">${n}</span>` : ' <span class="okmark">✓</span>')}</div>
    <div class="panel-body" id="pbody">${tab === "edit" ? editHTML() : tab === "preview" ? previewHTML({ checks: false }) : checksHTML()}</div>`;
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-tab]");
  if (!b) return;
  tab = b.dataset.tab;
  $("#panel").innerHTML = panelHTML();
});

const LAYOUT = {
  render() {
    document.getElementById("app").innerHTML = `
      ${demoBar("Demo B · master–detail")}
      <div class="page">
        <header id="hdr">${headerHTML()}</header>
        <div class="sentence" id="sentence">${sentenceHTML()}</div>
        <div class="toolbar">${recipesHTML()}${modeToggle()}</div>
        <div class="grid">
          <main class="canvas" id="canvas">${view.mode === "form" ? formCanvas() : ladderCanvas()}</main>
          <aside class="panel" id="panel" aria-label="Selected part">${panelHTML()}</aside>
        </div>
        <div class="savebar" id="savebar">${savebarHTML()}</div>
      </div>`;
  },
  refresh() {
    $("#hdr").innerHTML = headerHTML();
    $("#sentence").innerHTML = sentenceHTML();
    $("#canvas").innerHTML = view.mode === "form" ? formCanvas() : ladderCanvas();
    $("#savebar").innerHTML = savebarHTML();
    $("#panel .tabs").outerHTML = panelHTML().split('<div class="panel-body"')[0];
    if (tab !== "edit") $("#pbody").innerHTML = tab === "preview" ? previewHTML({ checks: false }) : checksHTML();
    syncErrors();
  },
  select() {
    tab = "edit";
    $("#canvas").innerHTML = view.mode === "form" ? formCanvas() : ladderCanvas();
    $("#panel").innerHTML = panelHTML();
  },
};
LAYOUT.render();

</script>
</body>
</html>
