/* ==========================================================================
   Homogenization layer (loaded last). One look for each kind of thing.
   ========================================================================== */

/* ---- card depth: rows take the tone opposite to their container ---- */
.page { --row-bg: var(--color-surface); }
.dock, .drawer, .dlg { --row-bg: var(--color-canvas); }
.row-sum, .row-card, .sim-row, .check--row, .tpl-peek, .insp { background: var(--row-bg); }
.fg:not(.fg--root) { background: color-mix(in srgb, var(--color-accent) 3%, var(--row-bg)); }

/* ---- A1 OptionCard: one look for every "pick one of these" ---- */
.bcard, .role-opt, .cn-opt, .trig-opt, .aw-type {
  border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--row-bg, var(--color-canvas));
  color: var(--color-ink); box-shadow: none; transition: border-color .12s, background .12s, box-shadow .12s; cursor: pointer; }
.bcard:hover, .role-opt:hover, .cn-opt:hover, .trig-opt:hover:not(:disabled), .aw-type:hover { border-color: color-mix(in srgb, var(--color-accent) 50%, var(--color-border)); }
.bcard.is-on, .role-opt.is-on, .cn-opt.is-on, .trig-opt[aria-checked="true"], .aw-type[aria-checked="true"] {
  border-color: var(--color-accent); background: var(--color-accent-muted); box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-accent) 12%, transparent); }
/* full variant: radio · title · description */
.bcard, .role-opt, .cn-opt { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 10px; row-gap: 8px; align-items: start; padding: 12px 14px; }
.bcard input, .role-opt input, .cn-opt input { position: static; margin: 3px 0 0; accent-color: var(--color-accent); }
.bcard-t, .role-opt > span, .cn-opt > span { display: flex; flex-direction: column; gap: 2px; padding: 0; }
.bcard strong, .role-opt strong, .cn-opt strong { font-size: 14px; font-weight: 600; }
.bcard small, .role-opt small, .cn-opt small { font-size: 12.5px; color: var(--color-ink-muted); }
.bcard .tl { grid-column: 1 / -1; }
/* compact variant: icon · label */
.trig-opt, .aw-type { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 8px 12px; font-size: 13.5px; font-weight: 500; color: var(--color-ink-muted); }
.aw-type { flex-direction: column; gap: 6px; }
.trig-opt[aria-checked="true"], .aw-type[aria-checked="true"] { color: var(--color-accent-strong); }

/* ---- A2 badges: pills for state, tags for categories ---- */
.tag, .role { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 6px; border: 0; background: var(--color-surface-raised); color: var(--color-ink); white-space: nowrap; }
.role--viewer { color: var(--color-ink); }
.pill--active { --tone: var(--color-status-online); }
.pill--invited { --tone: var(--color-status-pending); }
.pill--invited .pill-dot { background: transparent; box-shadow: inset 0 0 0 2px var(--tone); }

/* ---- B4 one full-page layout: page header, flowing sections, viewport-sticky footer ---- */
.edpage { border: 0; border-radius: 0; box-shadow: none; background: transparent; }
.edpage .pane-head { padding: 0 0 14px; border-bottom: 0; align-items: flex-end; }

    b.innerHTML = icon(t === "dark" ? "sun" : "moon", 16) + (b.dataset.themeToggle === "label" ? `<span>${t === "dark" ? "Light theme" : "Dark theme"}</span>` : "");

  });
}
function toggleTheme() {
  const next = effectiveTheme(DARK_FIRST) === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem(THEME_KEY, next); } catch {}
  syncThemeButtons();

}
function initTheme(key, darkFirst) {

/* ------------------------------------------------------------ toasts -- */
function toast(msg, { tone = "success", detail = "", action = null } = {}) {
  let reg = $("#toasts");
  if (!reg) { reg = el("div", "toast-region"); reg.id = "toasts"; reg.setAttribute("aria-live", "polite"); document.body.append(reg); }
  const t = el("div", `toast toast--${tone}`);
  t.setAttribute("role", tone === "error" ? "alert" : "status");
  const ic = tone === "error" ? "alert" : tone === "info" ? "info" : "check";
  t.innerHTML = `<span class="toast-ico">${icon(ic, 16)}</span><div class="toast-text"><strong>${esc(msg)}</strong>${detail ? `<span>${esc(detail)}</span>` : ""}</div>${action ? `<button type="button" class="toast-action">${esc(action.label)}</button>` : ""}<button type="button" class="toast-close" aria-label="Dismiss">${icon("x", 14)}</button>`;
  const kill = () => { t.classList.add("is-leaving"); setTimeout(() => t.remove(), 180); };
  t.querySelector(".toast-close").onclick = kill;
  if (action) t.querySelector(".toast-action").onclick = () => { action.run(); kill(); };
  reg.append(t);
  setTimeout(kill, tone === "error" ? 9000 : 5500);
}

function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function seriesFor(d, m, n, cycles = 1) {

  const rnd = mulberry32(parseInt(d.id.slice(1), 10) * 97 + m.key.length * 13 + n);
  const end = readingFor(d, m).v;
  const vals = [];
  for (let i = 0; i < n; i++) {
    const p = i / (n - 1);
    const wave = Math.sin(p * Math.PI * 2 * cycles - Math.PI * 0.55) * b.amp;
    vals.push(b.v + wave + (rnd() - 0.5) * b.amp * 0.35);
  }

  if (d.conn === "offline") { const cut = Math.floor(n * 0.86); for (let i = cut; i < n; i++) out[i] = null; }
  return out;
}
function niceTicks(lo, hi, count = 4) {

  const step = [1, 2, 2.5, 5, 10].map((f) => f * mag).find((s) => s >= raw);
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, t = [];

}
function trendSVG({ values, threshold = null, unit = "", xLabels = [], label = "", w = 720, h = 250, gapLabel = "" }) {
  const nums = values.filter((v) => v != null);

  const L = 44, R = 16, T = 16, B = 28, iw = w - L - R, ih = h - T - B;
  const x = (i) => L + i * (iw / (values.length - 1));
  const y = (v) => T + (1 - (v - lo) / (hi - lo)) * ih;
  let line = "", pen = false, lastI = 0;
  values.forEach((v, i) => { if (v == null) { pen = false; return; } line += `${pen ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`; pen = true; lastI = i; });
  const area = `${line}L${x(lastI).toFixed(1)},${T + ih}L${L},${T + ih}Z`;
  const gid = "g" + uid();
  const grid = ticks.map((t) => `<line class="ch-grid" x1="${L}" x2="${w - R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/><text class="ch-axis" x="${L - 8}" y="${(y(t) + 4).toFixed(1)}" text-anchor="end">${t}</text>`).join("");
  const xl = xLabels.map(([i, txt], k) => `<text class="ch-axis" x="${x(i).toFixed(1)}" y="${h - 8}" text-anchor="${k === 0 ? "start" : k === xLabels.length - 1 ? "end" : "middle"}">${esc(txt)}</text>`).join("");
  const thr = threshold != null ? `<line class="ch-thr" x1="${L}" x2="${w - R}" y1="${y(threshold).toFixed(1)}" y2="${y(threshold).toFixed(1)}"/><text class="ch-thr-label" x="${w - R - 4}" y="${(y(threshold) - 6).toFixed(1)}" text-anchor="end">Rule threshold ${threshold} ${esc(unit)}</text>` : "";
  const gap = lastI < values.length - 1 ? `<rect class="ch-gap" x="${x(lastI).toFixed(1)}" y="${T}" width="${(x(values.length - 1) - x(lastI)).toFixed(1)}" height="${ih}"/><text class="ch-axis" x="${((x(lastI) + x(values.length - 1)) / 2).toFixed(1)}" y="${T + 16}" text-anchor="middle">${esc(gapLabel || "No data")}</text>` : "";
  const lv = values[lastI];

    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--color-chart);stop-opacity:.28"/><stop offset="1" style="stop-color:var(--color-chart);stop-opacity:0"/></linearGradient></defs>

      return `<div class="sim-row"><div><strong>${esc(m?.name ?? c.metric)}</strong> <span class="muted">${esc(devName(c.dev))} · needs ${esc(opSym(c.op))} ${esc(valueText(c))}</span></div>

    ${d.when.type !== "metric" ? `<p class="panel-hint">Replay applies to reading rules. This rule fires on its ${d.when.type === "schedule" ? "schedule" : d.when.type === "manual" ? "Run now button" : "connection changes"}, so use the values above instead.</p>` : RWS.replay ? RWS.replay : `<button type="button" class="btn btn--secondary" data-rw="replay">${icon("refresh", 14)}Replay 24 h</button>`}</div>`;
}
function replayHTML() {
  const d = RW.draft, cs = contactsOf(d.cond), N = 96;
  const series = {}; cs.forEach((c) => { const dv = DEVICES.find((x) => x.id === c.dev), m = metricOf(c.dev, c.metric); series[c.id] = dv && m && m.data_type !== "bool" && dv.conn !== "never" ? seriesFor(dv, m, N, 1) : Array(N).fill(m?.data_type === "bool" ? "off" : null); });
  const states = [], fires = []; let armed = true, last = -1e9;
  for (let i = 0; i < N; i++) {
    const v = {}; cs.forEach((c) => (v[c.id] = series[c.id][i])); const r = evalNode(d.cond, v); states.push(r);
    if (r === true && armed && (i - last) * 900 >= +d.cooldown) { fires.push(i); last = i; armed = false; }
    if (r === false && d.behaviour === "rearm") armed = true;
  }
  const t = (i) => `${String(Math.floor(i / 4)).padStart(2, "0")}:${String((i % 4) * 15).padStart(2, "0")}`;
  return `<div class="strip" role="img" aria-label="Condition over 24 hours">${states.map((s, i) => `<span class="st st--${s === true ? "t" : s === false ? "f" : "u"}${fires.includes(i) ? " is-fire" : ""}" title="${t(i)}"></span>`).join("")}</div>
    <div class="strip-axis"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>now</span></div>
    <p><strong>Would have fired ${fires.length} time${fires.length === 1 ? "" : "s"}</strong>${fires.length ? ` at ${fires.map(t).join(", ")}` : ""}.${d.behaviour === "latch" && fires.length ? " Latched after the first." : ""} ${states.includes(null) ? "Gaps are periods with no data." : ""}</p>`;
}

    const [h, id, f] = path.split(".");
    if (h === "c" && f === "dev") { const n = findNode(RW.draft.cond, id), m = tplOf(DEVICES.find((d) => d.id === n.dev)).metrics.find((x) => x.key === n.metric) || tplOf(DEVICES.find((d) => d.id === n.dev)).metrics[0]; n.metric = m.key; }
    if (h === "c" && (f === "dev" || f === "metric")) { const n = findNode(RW.draft.cond, id), m = metricOf(n.dev, n.metric); if (m?.data_type === "bool") { n.op = "=="; n.value = "on"; } else if (!HYST_OPS.includes(n.op) && n.op !== "between" && n.op !== "==" && n.op !== "!=") n.op = ">"; }

    const lastDev = () => contactsOf(d.cond).at(-1)?.dev || "d01";
    const newContact = () => { const dv = lastDev(), m = tplOf(DEVICES.find((x) => x.id === dv)).metrics[0]; return contact(dv, m.key, m.data_type === "bool" ? "==" : ">", m.data_type === "bool" ? "on" : "", m.data_type === "bool" ? 0 : 1); };
    if (k === "tab") { RWS.tab = b.dataset.v; return rerender(); }

    if (k === "trig") { d.when.type = b.dataset.v; if (b.dataset.v !== "metric") d.actions.forEach((a) => (a.revert = false)); return re(); }
    if (k === "op") { const g = findNode(d.cond, id); g.op = b.dataset.v; d.cond = normalizeTree(d.cond); return re(); }

  if (isAdmin()) items.push({ label: "Edit…", icon: "pencil", run: () => openEditor("devedit", d.id) }, { label: "Get firmware…", icon: "cpu", run: () => openConnect(d.id) }, { label: "Rotate token…", icon: "key", run: () => rotateFlow(d) },
    { label: d.enabled ? "Disable" : "Enable", icon: "power", run: () => toggleDevice(d, after) }, "-", { label: "Delete device…", icon: "trash", danger: true, run: () => deleteDeviceFlow(d, after) });

};

/* ------------------------------------------------ device detail (operational → full page; config opens as a drawer over it) ---- */
let devTab = "overview";
PAGES.device = () => {
  const d = DEVICES.find((x) => x.id === R.pid);
  view.classList.remove("is-wide");
  if (!d) { page(`${crumbs([["Devices", "devices"], ["Not found"]])}<div class="state state--empty"><h3>This device doesn’t exist</h3><p>It may have been deleted, or the link belongs to another workspace.</p><button type="button" class="btn btn--secondary" data-crumb="devices">Back to devices</button></div>`); return; }
  const t = tplOf(d), rules = RULES.filter((r) => ruleTouches(r, d.id));
  const tabs = [["overview", "Overview"], ["controls", "Controls", t.actuators.length], ["rules", "Rules", rules.length], ["settings", "Settings"]];
  const p = page(`${crumbs([["Devices", "devices"], [d.name]])}
    <header class="ph"><div><h1><span class="mono-h">${esc(d.name)}</span>${statusPill(d)}</h1>
      <div class="meta"><span>${esc(d.zone)}</span><span>Template <button type="button" class="link-btn" data-tpl>${esc(t.name)}</button></span><span>Last seen <b>${fmtAgo(d.seen)}</b></span><span>Firmware <b>1.2.0</b></span><span>Signal <b>−63 dBm</b></span></div></div>
      <div class="actions">${isAdmin() && d.conn === "never" ? `<button type="button" class="btn btn--primary" data-connect>${icon("zap", 15)}Connect device</button>` : ""}${isAdmin() ? `<button type="button" class="btn btn--secondary" data-edit>${icon("pencil", 15)}Edit device</button>` : ""}</div></header>
    <div class="dtabs" role="tablist" aria-label="Device sections">${tabs.map(([k, l, c]) => `<button type="button" class="dtab" role="tab" data-dtab="${k}" aria-selected="${devTab === k}">${l}${c != null ? `<span class="cnt">${c}</span>` : ""}</button>`).join("")}</div>
    <div role="tabpanel">${devTab === "overview" ? `<div class="stack"><section class="readouts" aria-label="Latest readings">${ddReadouts(d)}</section><section class="card"><div data-region="dd-chart">${ddChart(d)}</div></section></div>`
      : devTab === "controls" ? `<section class="card"><h2>Actuators</h2><p class="muted">Switching sends a command and waits for the device to acknowledge it.</p>${ddActuators(d)}</section>`
      : devTab === "rules" ? `<section class="card"><div class="card-h"><div><h2>Rules watching this device</h2><p class="muted">Stale or missing data is unknown. It never fires or clears a rule.</p></div>${isAdmin() ? `<button type="button" class="btn btn--secondary btn--sm" data-newrule>${icon("plus", 14)}New rule</button>` : ""}</div>
          ${rules.length ? `<ul class="rule-list">${rules.map((r) => { const st = !r.enabled ? "unknown" : r.state === "latched" ? "latched" : d.conn !== "online" || !d.enabled ? "unknown" : r.state; return `<li class="rule"><span class="pill pill--rule-${st}"><span class="pill-dot" aria-hidden="true"></span>${!r.enabled ? "Disabled" : st === "latched" ? "Latched" : st === "unknown" ? "No data" : st === "fired" ? "Firing" : "Armed"}</span><div class="rule-body"><button type="button" class="cell-name" data-rule="${r.id}">${esc(r.name)}</button><code class="mono">${esc(r.cond)}</code><span class="muted">→ ${esc(r.action)} · ${esc(r.last)}</span></div></li>`; }).join("")}</ul>` : '<p class="muted">No rules watch this device yet.</p>'}</section>`
      : `<div class="two"><section class="card"><h2>Credentials and firmware</h2>${ddCredentials(d)}${isAdmin() ? `<div class="cred"><div><strong>Firmware</strong><p class="muted">A ready-to-flash sketch for this device, built from its template. Getting it rotates the credential.</p></div><button type="button" class="btn btn--secondary" data-connect>${icon("cpu", 14)}Get firmware</button></div>` : ""}</section>${isAdmin() ? `<section class="card"><h2>Manage device</h2>${ddDanger(d)}</section>` : ""}</div>`}</div>`);

/* ------------------------------------------------ rules ---- */
const RL = { q: "", state: "all" };
const RSTATE = { armed: "Armed", fired: "Firing", latched: "Latched", disabled: "Disabled" };
function rulesTableHTML() {
  const q = RL.q.trim().toLowerCase();
  const rows = RULES.filter((r) => (!q || `${r.name} ${r.cond} ${r.action} ${tplName(r.tpl)}`.toLowerCase().includes(q)) && (RL.state === "all" || ruleState(r) === RL.state));
  if (!RULES.length) return `<div class="state state--empty"><span class="state-ico">${icon("rules", 26)}</span><h3>No rules yet</h3><p>Rules watch live readings and switch actuators or notify people within two seconds.</p>${isAdmin() ? `<button type="button" class="btn btn--primary" data-newrule>${icon("plus", 14)}New rule</button>` : ""}</div>`;
  if (!rows.length) return `<div class="state state--empty"><h3>No rules match</h3><button type="button" class="btn btn--secondary" data-rclear>Clear filters</button></div>`;
  return `<div class="table-wrap"><table class="dt"><thead><tr><th scope="col">Rule</th><th scope="col" class="hide-sm">When</th><th scope="col" class="hide-sm">Then</th><th scope="col">State</th><th scope="col" class="hide-sm">Last fired</th><th scope="col" class="col-act"><span class="sr">Actions</span></th></tr></thead><tbody>
    ${rows.map((r) => { const s = ruleState(r); return `<tr data-row="${r.id}" data-kind="rule" class="${editorOf(R)?.id === r.id ? "is-current" : ""}"><td><button type="button" class="cell-name" data-open-rule="${r.id}">${esc(r.name)}</button><span class="sub">${esc(ruleScope(r))}</span></td>
      <td class="hide-sm"><code class="mono cond">${esc(r.cond)}</code></td><td class="hide-sm">${esc(r.action)}</td>
      <td><span class="pill pill--${s === "disabled" ? "disabled" : "rule-" + s}"><span class="pill-dot" aria-hidden="true"></span>${RSTATE[s]}</span></td><td class="hide-sm muted">${esc(r.last)}</td>
      <td class="col-act"><button type="button" class="icon-btn" data-rmenu="${r.id}" aria-haspopup="menu" aria-expanded="false" aria-label="Actions for ${esc(r.name)}">${icon("more", 16)}</button></td></tr>`; }).join("")}</tbody></table></div>`;
}
PAGES.rules = () => {
  const failed = R.pid === "failed";
  const p = listPage({ title: "Rules", lede: "Evaluated in memory the moment a reading arrives. Breach to actuator command is typically under 500 ms.",
    actions: isAdmin() && !failed ? `<button type="button" class="btn btn--primary" data-newrule>${icon("plus", 15)}New rule</button>` : "",
    body: `<div class="subtabs" role="tablist" aria-label="Rule views"><button type="button" role="tab" data-rtab="" aria-selected="${!failed}">Rules <span class="cnt">${RULES.length}</span></button><button type="button" role="tab" data-rtab="failed" aria-selected="${failed}">Failed deliveries ${FAILED.length ? `<span class="cnt cnt--alert">${FAILED.length}</span>` : ""}</button></div>
      ${failed ? `<div data-region="failed"></div>` : `<div class="toolbar"><div class="search-field">${icon("search", 15)}<input class="input" id="rlSearch" type="search" placeholder="Search rules" value="${esc(RL.q)}" aria-label="Search rules"></div>
        <select class="input select" id="rlState" aria-label="Filter by state" style="width:auto">${[["all", "All states"], ["armed", "Armed"], ["fired", "Firing"], ["latched", "Latched"], ["disabled", "Disabled"]].map(([v, l]) => `<option value="${v}"${RL.state === v ? " selected" : ""}>${l}</option>`).join("")}</select></div><div data-region="rl"></div>`}` });
  const drawRules = () => { const r = $('[data-region="rl"]', p); if (r) r.innerHTML = rulesTableHTML(); };
  const drawFailed = () => { const r = $('[data-region="failed"]', p); if (!r) return; r.innerHTML = FAILED.length ? `<div class="table-wrap"><table class="dt"><thead><tr><th scope="col">When</th><th scope="col">Rule</th><th scope="col" class="hide-sm">Action</th><th scope="col">Error</th><th scope="col" class="col-act"><span class="sr">Retry</span></th></tr></thead><tbody>
      ${FAILED.map((f) => { const r = RULES.find((x) => x.id === f.rule); return `<tr><td class="muted">${esc(f.t)}</td><td>${r ? `<button type="button" class="cell-name" data-open-rule="${r.id}">${esc(r.name)}</button>` : "Deleted rule"}<span class="sub">${esc(f.target)}</span></td><td class="hide-sm">${esc(f.action)}</td><td><span class="err-text">${esc(f.error)}</span></td>
        <td class="col-act" style="width:auto"><button type="button" class="btn btn--secondary btn--sm" data-retry="${f.id}"${isAdmin() ? "" : " disabled"}>${icon("refresh", 13)}Retry</button></td></tr>`; }).join("")}</tbody></table></div>`
    : `<div class="state state--empty"><span class="state-ico">${icon("check", 24)}</span><h3>Nothing failed</h3><p>Webhook, email and actuator deliveries that fail show up here with the reason.</p></div>`; };
  drawRules(); drawFailed();
  p.addEventListener("input", (e) => { if (e.target.id === "rlSearch") { RL.q = e.target.value; drawRules(); } });
  p.addEventListener("change", (e) => { if (e.target.id === "rlState") { RL.state = e.target.value; drawRules(); } });
  p.addEventListener("click", async (e) => {
    const tab = e.target.closest("[data-rtab]"); if (tab) return navigate({ page: "rules", pid: tab.dataset.rtab || null, panel: R.panel });
    if (e.target.closest("[data-newrule]")) return openEditor("rule", "new");
    if (e.target.closest("[data-rclear]")) { RL.q = ""; RL.state = "all"; return render(); }
    const o = e.target.closest("[data-open-rule]"); if (o) return openEditor("rule", o.dataset.openRule);
    const m = e.target.closest("[data-rmenu]"); if (m) { const r = RULES.find((x) => x.id === m.dataset.rmenu); return openMenu(m, [{ label: isAdmin() ? "Edit" : "View", icon: isAdmin() ? "pencil" : "eye", run: () => openEditor("rule", r.id) }, ...(isAdmin() ? [{ label: "Duplicate", icon: "duplicate", run: () => openEditor("rule", "new", { dup: r }) }, { label: r.enabled ? "Disable" : "Enable", icon: "power", run: () => { r.enabled = !r.enabled; render(); toast(`${r.name} ${r.enabled ? "enabled" : "disabled"}`); } }, "-", { label: "Delete…", icon: "trash", danger: true, run: () => deleteRuleFlow(r) }] : [])]); }
    const rt = e.target.closest("[data-retry]"); if (rt) { rt.disabled = true; rt.textContent = "Retrying…"; await sleep(800); FAILED.splice(FAILED.findIndex((f) => f.id === rt.dataset.retry), 1); render(); toast("Delivered on retry"); }
  });
};

let notifFilter = "all";
PAGES.notifications = () => {
  view.classList.remove("is-wide");
  const list = NOTIFS.filter((n) => notifFilter === "all" || !n.read);
  const sevIcon = { critical: "alert", warning: "zap", info: "info" };
  const p = page(`<header class="ph"><div><h1>Notifications</h1><p>What rules and devices reported. Links open the related device page or rule editor.</p></div>
      <div class="actions"><button type="button" class="btn btn--secondary" id="markAll"${unread() ? "" : " disabled"}>${icon("check", 15)}Mark all as read</button></div></header>
    <div class="seg seg--page" role="group" aria-label="Show"><button type="button" data-nf="all" aria-pressed="${notifFilter === "all"}">All</button><button type="button" data-nf="unread" aria-pressed="${notifFilter === "unread"}">Unread ${unread() ? `(${unread()})` : ""}</button></div>
    ${list.length ? `<ul class="notifs">${list.map((n) => `<li class="notif notif--${n.sev}${n.read ? "" : " is-unread"}" data-nid="${n.id}"><span class="n-ico">${icon(sevIcon[n.sev], 16)}</span>
      <div class="n-body"><strong>${esc(n.title)}</strong><span>${esc(n.detail)}</span>
        <span class="n-links">${n.dev ? `<button type="button" class="link-btn" data-ndev="${n.dev}">Open device</button>` : ""}${n.rule ? `<button type="button" class="link-btn" data-nrule="${n.rule}">Open rule</button>` : ""}${n.tpl ? `<button type="button" class="link-btn" data-ntpl="${n.tpl}">Open template</button>` : ""}</span></div>
      <span class="n-time">${esc(n.t)}</span>${n.read ? "" : `<button type="button" class="icon-btn" data-nread="${n.id}" aria-label="Mark as read">${icon("check", 15)}</button>`}</li>`).join("")}</ul>`
    : `<div class="state state--empty"><span class="state-ico">${icon("bell", 24)}</span><h3>You’re all caught up</h3><p>New alerts from rules and devices appear here and in the bell.</p></div>`}`);
  p.addEventListener("click", (e) => {
    const f = e.target.closest("[data-nf]"); if (f) { notifFilter = f.dataset.nf; return render(); }
    if (e.target.closest("#markAll")) { NOTIFS.forEach((n) => (n.read = true)); render(); return toast("All notifications marked as read"); }
    const rd = e.target.closest("[data-nread]"); if (rd) { NOTIFS.find((n) => n.id === rd.dataset.nread).read = true; return render(); }
    const mark = (btn) => { const n = NOTIFS.find((x) => x.id === btn.closest("[data-nid]").dataset.nid); n.read = true; };
    const dv = e.target.closest("[data-ndev]"); if (dv) { mark(dv); return navigate({ page: "device", pid: dv.dataset.ndev, panel: null }); }
    const ru = e.target.closest("[data-nrule]"); if (ru) { mark(ru); return openEditor("rule", ru.dataset.nrule); }
    const tp = e.target.closest("[data-ntpl]"); if (tp) { mark(tp); return openEditor("template", tp.dataset.ntpl); }
  });
};

  const ble = CONNECT.wifi === "ble";

    <div class="cn-two">

<pre>${esc(`[BOOT] iodriven fw 1.0.0 · ${d.name}
${ble ? `[PROV] no Wi-Fi stored, advertising over BLE as ${d.name.slice(0, 20)}\n[PROV] status {"state":"connecting","reason":""}\n` : ""}[WIFI] connected, ip 192.168.1.47, rssi -61
[MQTT] connecting to ${CONNECT.tls ? "mqtt.iodriven.tech:8883 (tls)" : "192.168.1.20:1883"}

}
function liveItems(d) {
  const t = tplOf(d);

    ...t.metrics.map((m) => ({ k: "m:" + m.key, label: `First reading: ${m.name}`, sub: `…/${m.key}`, hint: m.data_type === "bool" ? `Check the wiring on GPIO ${CONNECT.pins["m:" + m.key]}.` : `read${camel(m.key)}() returns NAN until you add your sensor code; NAN is never published.` })),
    ...t.actuators.filter((a) => a.value_type !== "str").map((a) => ({ k: "a:" + a.key, label: `Command test: ${a.name}`, sub: `…/cmd/${a.key} → ack`, action: true, hint: `Nothing on GPIO ${CONNECT.pins["a:" + a.key]}? Check the relay’s supply and whether it’s active-low.` })),

function step4(d) {
  const items = liveItems(d), L = CONNECT.live, done = items.every((it) => L[it.k]?.ok);

  return `<h2>Live check</h2><p class="lead">This page listens for ${esc(d.name)}. Each line turns green on its own as the board connects, reports and answers.</p>
    ${CONNECT.done ? `<div class="cn-win">${icon("check", 22)}<div><strong>${esc(d.name)} is live.</strong> Readings are flowing and every actuator answered. Rules for ${esc(tplName(d.tpl))} now evaluate it.</div><button type="button" class="btn btn--primary" data-cn="open">Open device ${icon("chevR", 14)}</button><button type="button" class="btn btn--secondary" data-cn="another">Set up another device</button></div>` : `<p class="ac-demo">${icon("info", 13)}<span>Demo: the board “boots” a few seconds after you open this step.</span></p>`}
    <ul class="checks">${items.map((it) => { const s = L[it.k] || {}, st = s.ok ? "ok" : s.busy ? "busy" : "wait";
      return `<li class="ck ck--${st}"><span class="ck-i" aria-hidden="true">${st === "ok" ? icon("check", 14) : st === "busy" ? '<span class="spin"></span>' : '<span class="dot-wait"></span>'}</span>
        <div class="ck-t"><strong>${esc(it.label)}</strong><span class="mono">${esc(it.sub)}</span>${s.detail ? `<span class="ck-d">${s.detail}</span>` : ""}
          ${st === "wait" && !it.action ? `<details class="ck-h"><summary>Not showing up?</summary><p>${esc(it.hint)}</p></details>` : ""}</div>
        ${it.action ? `<button type="button" class="btn btn--secondary btn--sm" data-cn-test="${it.k}"${!L.status?.ok || s.ok || s.busy ? " disabled" : ""}>${s.ok ? "Acknowledged" : "Send test: on"}</button>` : ""}</li>`; }).join("")}</ul>
    ${cnNav(3, null)}`;
}
function runLiveCheck(d) {
  stopConnectTimers();
  const items = liveItems(d), L = CONNECT.live, t = tplOf(d);
  const redraw = () => { const b = $("#cnBody"); if (b && R.page === "connect" && CONNECT.step === 4) { b.innerHTML = step4(d); if (CONNECT.done) { $$(".cn-step").forEach((x) => x.classList.replace("cn-step--cur", "cn-step--done")); toast(`${d.name} is live`, { detail: "First readings received and commands acknowledged." }); } } };
  const at = (ms, fn) => CONNECT.timers.push(setTimeout(() => { fn(); redraw(); }, ms));
  let ms = 1800;
  if (!L.status?.ok) at(ms, () => (L.status = { ok: true, detail: "rssi −61 dBm · fw 1.0.0" }));
  ms += 900; if (!L.config?.ok) at(ms, () => (L.config = { ok: true, detail: `${t.metrics.length} metric profiles` }));
  t.metrics.forEach((m) => { ms += 1100; const k = "m:" + m.key; if (!L[k]?.ok) at(ms, () => { const r = readingFor(d, m); L[k] = { ok: true, detail: m.data_type === "bool" ? (r.bool ? "on" : "off") : `${r.v} ${m.unit ?? ""}` }; }); });
}
async function sendTest(d, k) {
  const L = CONNECT.live; L[k] = { busy: true }; $("#cnBody").innerHTML = step4(d);
  await sleep(700); const ms = Math.round(170 + Math.random() * 80); L[k] = { ok: true, detail: `acknowledged in ${ms} ms` }; if (R.page === "connect") { $("#cnBody").innerHTML = step4(d); if (CONNECT.done) toast(`${d.name} is live`, { detail: "First readings received and commands acknowledged." }); }
}
async function onConnectClick(e, d) {
  const go = e.target.closest("[data-cn-go]"); if (go) { CONNECT.step = +go.dataset.cnGo; return render(); }
  const st = e.target.closest("[data-cn-step]"); if (st && !st.disabled) { CONNECT.step = +st.dataset.cnStep; return render(); }
  const tb = e.target.closest("[data-cn-test]"); if (tb) return sendTest(d, tb.dataset.cnTest);
  const b = e.target.closest("[data-cn]"); if (!b) return;
  const k = b.dataset.cn;
  if (k === "later") { stopConnectTimers(); return navigate({ page: "device", pid: d.id, panel: null }); }
  if (k === "rotate") {
    if (d.conn !== "never" && !(await confirmDialog({ title: `Rotate the credential for ${d.name}?`, tone: "danger", confirmLabel: "Rotate credential", body: `<p>The firmware running now disconnects until the new sketch is flashed.</p>` }))) return;
    CONNECT.token = newToken(); if (d.conn !== "never") d.conn = "offline"; render(); toast("Credential rotated", { detail: "Store it, then continue to the firmware." }); return;
  }
  if (k === "reveal") { CONNECT.showSecret = !CONNECT.showSecret; return render(); }
  if (k === "copytok" || k === "copysketch") {
    const text = k === "copytok" ? CONNECT.token : sketchText(d);
    try { await navigator.clipboard.writeText(text); toast(k === "copytok" ? "Token copied" : "Sketch copied", { detail: k === "copysketch" ? "It includes the full credential." : "" }); }
    catch { toast("Couldn’t reach the clipboard", { tone: "error", detail: "Select the text and copy it with Ctrl+C." }); }
    return;
  }
  if (k === "download") return toast(`${cid(d.name)}.ino`, { tone: "info", detail: "In the app this saves the sketch. The demo preview can’t download files; use Copy sketch." });
  if (k === "open") return navigate({ page: "device", pid: d.id, panel: null });
  if (k === "another") return openEditor("devedit", "new");
}
function onConnectChange(e, d) {

  const o = e.target.closest("[data-cn-opt]"); if (o) { const n = o.dataset.cnOpt; CONNECT[n] = n === "tls" ? o.value === "true" : o.value; return render(); }
  const pn = e.target.closest("[data-cn-pin]"); if (pn) { CONNECT.pins[pn.dataset.cnPin] = +pn.value; render(); $(`[data-cn-pin="${pn.dataset.cnPin}"]`)?.focus(); }

  }
}

/* ==========================================================================
   Demo E — homogenization layer. Same flows, one system:
   C  every list: ListToolbar (search · quick-filter segments with counts · extra),
      count footer, ⋮ on every row, and a row hint (panel "Open" vs page "→").
   D  Settings saves like a record: one sticky save bar, Discard, leave warning.
   (A, B, E are mostly styling: see the homogenization CSS layer.)
   ========================================================================== */
function listToolbar({ id, q, placeholder, quick = null, value = null, extra = "" }) {
  return `<div class="ltb"><div class="search-field">${icon("search", 15)}<input class="input" id="${id}" type="search" value="${esc(q)}" placeholder="${esc(placeholder)}" aria-label="${esc(placeholder)}" autocomplete="off"></div>
    ${quick ? `<div class="seg seg--q" role="group" aria-label="Filter">${quick.map(([v, l, n]) => `<button type="button" data-q="${v}" aria-pressed="${value === v}">${esc(l)}${n != null ? `<span class="q-n">${n}</span>` : ""}</button>`).join("")}</div>` : ""}${extra}</div>`;
}
const tableFoot = (shown, total, noun) => `<div class="dt-foot"><span>${shown === total ? `${total} ${noun}` : `${shown} of ${total} ${noun}`}</span></div>`;
const noMatch = (what) => `<div class="state state--empty"><span class="state-ico">${icon("search", 24)}</span><h3>No ${what} match these filters</h3><button type="button" class="btn btn--secondary" data-clearq>Clear filters</button></div>`;
function bindToolbar(root, id, st, redraw) {
  root.addEventListener("input", (e) => { if (e.target.id === id) { st.q = e.target.value; redraw(); } });
  root.addEventListener("click", (e) => {
    const b = e.target.closest("[data-q]"); if (b) { st.f = b.dataset.q; $$("[data-q]", root).forEach((x) => x.setAttribute("aria-pressed", String(x === b))); redraw(); return; }
    if (e.target.closest("[data-clearq]")) { st.q = ""; st.f = st.def ?? "all"; render(); }
  });
}
const matches = (q, text) => !q.trim() || text.toLowerCase().includes(q.trim().toLowerCase());

/* ---------------- rules ---------------- */

      ${failed ? `<div data-region="failed"></div>` : listToolbar({ id: "rlSearch", q: RL.q, placeholder: "Search rules", quick: [["all", "All"], ["armed", "Armed"], ["fired", "Firing"], ["latched", "Latched"], ["disabled", "Disabled"]].map(([v, l]) => [v, l, cnt(v)]), value: RL.state }) + `<div data-region="rl"></div>`}` });
  const drawRules = () => { const r = $('[data-region="rl"]', p); if (!r) return; const n = RULES.filter(ruleMatches).length; r.innerHTML = RULES.length && !n ? noMatch("rules") : rulesTableHTML() + (n ? tableFoot(n, RULES.length, "rules") : ""); };

  const out = [], domAny = P.raw[2] === "*", dowAny = P.raw[4] === "*";
  for (let i = 0; i < 60 * 24 * 400 && out.length < n; i++) {
    const dayOk = domAny && dowAny ? true : domAny ? P.dow.includes(t.getDay()) : dowAny ? P.dom.includes(t.getDate()) : P.dom.includes(t.getDate()) || P.dow.includes(t.getDay());
    if (!P.mon.includes(t.getMonth() + 1) || !dayOk) { t.setDate(t.getDate() + 1); t.setHours(0, 0); continue; }
    if (!P.h.includes(t.getHours())) { t.setHours(t.getHours() + 1, 0); continue; }

function startLoginAnim() {
  stopLoginAnim();
  const cv = $("#authCanvas"); if (!cv) return;
  const ctx = cv.getContext("2d"); if (!ctx) return;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const rnd = mulberry32(7);
  // Five zones around a broker; each node is a real demo device.
  const zones = [["Bay 1", ["d01", "d09", "d10"]], ["Bay 2", ["d02", "d11"]], ["Bay 3", ["d03", "d12"]], ["Bay 4", ["d05", "d13"]], ["Pump house", ["d14", "d15"]], ["Propagation", ["d04", "d07", "d06"]]];

    W = r.width; H = r.height; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    broker = { x: W * 0.6, y: H * 0.6 };
    nodes = [];
    zones.forEach(([, ids], zi) => {
      const ang = -Math.PI * 0.95 + (zi / (zones.length - 1)) * Math.PI * 1.9, rad = Math.min(W, H) * 0.33;
      const cx = broker.x + Math.cos(ang) * rad * 1.15, cy = broker.y + Math.sin(ang) * rad * 0.62;
      ids.forEach((id, k) => { const d = DEVICES.find((x) => x.id === id); const a2 = ang + (k - (ids.length - 1) / 2) * 0.22; nodes.push({ id, x: cx + Math.cos(a2 + Math.PI / 2) * 26 * k * 0.6 + (rnd() - 0.5) * 18, y: cy + Math.sin(a2 + Math.PI / 2) * 26 * k * 0.6 + (rnd() - 0.5) * 18, on: d?.conn === "online", act: !!d && tplOf(d).actuators.length > 0, ring: 0 }); });
    });
  };
  const pulses = [];
  let last = performance.now(), spawnT = 0, cmdT = 1200;
  const frame = (now) => {
    const dt = Math.min(64, now - last); last = now; spawnT -= dt; cmdT -= dt;
    if (spawnT <= 0) { const on = nodes.filter((n) => n.on); const n = on[Math.floor(Math.random() * on.length)]; if (n) pulses.push({ from: n, to: broker, t: 0, sp: 0.0009 + Math.random() * 0.0006, cmd: false }); spawnT = 110 + Math.random() * 140; }
    if (cmdT <= 0) { const acts = nodes.filter((n) => n.on && n.act); const n = acts[Math.floor(Math.random() * acts.length)]; if (n) pulses.push({ from: broker, to: n, t: 0, sp: 0.0016, cmd: true }); cmdT = 2200 + Math.random() * 1400; }

    if (!reduce) authRaf = requestAnimationFrame(frame);
  };
  const draw = (dt) => {
    ctx.clearRect(0, 0, W, H);
    // faint dot grid
    ctx.fillStyle = "rgba(148,197,255,0.07)";
    for (let x = 12; x < W; x += 22) for (let y = 12; y < H; y += 22) ctx.fillRect(x, y, 1.2, 1.2);
    // links
    nodes.forEach((n) => { const g = ctx.createLinearGradient(n.x, n.y, broker.x, broker.y); g.addColorStop(0, n.on ? "rgba(125,211,252,0.28)" : "rgba(248,113,113,0.18)"); g.addColorStop(1, "rgba(125,211,252,0.04)"); ctx.strokeStyle = g; ctx.lineWidth = 1; ctx.setLineDash(n.on ? [] : [3, 4]); ctx.beginPath(); ctx.moveTo(n.x, n.y); ctx.lineTo(broker.x, broker.y); ctx.stroke(); });
    ctx.setLineDash([]);
    // pulses
    for (let i = pulses.length - 1; i >= 0; i--) {
      const p = pulses[i]; p.t += p.sp * dt;
      if (p.t >= 1) { if (p.cmd) p.to.ring = 1; pulses.splice(i, 1); continue; }
      const x = p.from.x + (p.to.x - p.from.x) * p.t, y = p.from.y + (p.to.y - p.from.y) * p.t;
      const col = p.cmd ? "251,191,36" : "125,211,252";
      const tx = p.from.x + (p.to.x - p.from.x) * Math.max(0, p.t - 0.12), ty = p.from.y + (p.to.y - p.from.y) * Math.max(0, p.t - 0.12);
      const g = ctx.createLinearGradient(tx, ty, x, y); g.addColorStop(0, `rgba(${col},0)`); g.addColorStop(1, `rgba(${col},0.9)`);
      ctx.strokeStyle = g; ctx.lineWidth = p.cmd ? 2.4 : 1.6; ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(x, y); ctx.stroke();
      ctx.fillStyle = `rgba(${col},1)`; ctx.beginPath(); ctx.arc(x, y, p.cmd ? 2.8 : 2, 0, Math.PI * 2); ctx.fill();
    }
    // nodes
    nodes.forEach((n) => {
      if (n.ring > 0) { ctx.strokeStyle = `rgba(251,191,36,${n.ring})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(n.x, n.y, 6 + (1 - n.ring) * 16, 0, Math.PI * 2); ctx.stroke(); n.ring = Math.max(0, n.ring - dt / 900); }
      ctx.fillStyle = n.on ? "#0b1628" : "#1a1116"; ctx.strokeStyle = n.on ? (n.act ? "#fbbf24" : "#7dd3fc") : "#f87171"; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.act ? 5.5 : 4.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    });
    // broker
    const pr = 18 + Math.sin(performance.now() / 600) * 2;
    const rg = ctx.createRadialGradient(broker.x, broker.y, 2, broker.x, broker.y, pr * 3); rg.addColorStop(0, "rgba(129,140,248,0.45)"); rg.addColorStop(1, "rgba(129,140,248,0)");
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(broker.x, broker.y, pr * 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#0b1020"; ctx.strokeStyle = "#a5b4fc"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(broker.x, broker.y, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#c7d2fe"; ctx.font = "600 10px 'Geist Mono', monospace"; ctx.textAlign = "center"; ctx.fillText("RULES · IN MEMORY", broker.x, broker.y + 30);
  };
  layout();
  if (reduce) { for (let i = 0; i < 18; i++) { const n = nodes[i % nodes.length]; if (n.on) pulses.push({ from: n, to: broker, t: (i * 0.37) % 1, sp: 0, cmd: false }); } draw(0); }
  else authRaf = requestAnimationFrame(frame);
  try { new ResizeObserver(() => { layout(); if (reduce) draw(0); }).observe(cv); } catch { addEventListener("resize", layout); }
  // live numbers in the chips
  authTimer = setInterval(() => {
    const set = (k, v) => $$(`#authHost [data-live="${k}"]`).forEach((n) => { n.textContent = v; n.classList.remove("tick"); void n.offsetWidth; n.classList.add("tick"); });
    set("t", `${(25 + Math.random() * 0.8).toFixed(1)} °C`); set("ack", `${Math.round(170 + Math.random() * 70)} ms`); set("tank", `${Math.round(70 + Math.random() * 4)} %`);
    set("p95", `${Math.round(178 + Math.random() * 14)} ms`); set("mpm", `${Math.round(205 + Math.random() * 16)}`);
  }, 2400);
}

/* ---------------- boot ---------------- */
mountDemoControls();
$(".demo-ctl-body").insertAdjacentHTML("beforeend", `<p class="route"><span>URL</span><code id="routeOut"></code></p><p>Links: <button type="button" class="link-btn" id="tryDirect">open a template by direct link</button> · <button type="button" class="link-btn" id="trySignOut">sign-in page</button> · <button type="button" class="link-btn" id="tryHome">landing page</button></p>`);
$("#tryHome").onclick = () => navigate({ page: "home", pid: null, panel: null });
$("#tryDirect").onclick = () => navigate({ page: "template", pid: "tpl-climate", panel: null });
$("#trySignOut").onclick = () => signOut();
navigate(location.hash ? parseHash(location.hash) : { page: "home", pid: null, panel: null }, { replace: true });

</script>
