# Declarative EMQX config for Phase 2's device auth. Mounted into the emqx
# container (see docker-compose.yml) so `docker compose up` fully reproduces
# this setup with no manual dashboard clicking.
#
# Mounting here REPLACES the image's default emqx.conf entirely (EMQX does not
# layer multiple emqx.conf files) — node/cluster/dashboard below are copied
# from the stock image's default file (`docker run --rm --entrypoint cat
# emqx/emqx:5.8 /opt/emqx/etc/emqx.conf`) purely so required fields like
# node.data_dir still exist; EMQX_NODE__COOKIE / EMQX_DASHBOARD__DEFAULT_PASSWORD
# (docker-compose.yml's emqx service) still win over the values here — env
# vars are the highest-precedence layer. The authentication/authorization
# blocks below are this file's actual purpose.
#
# The x-emqx-auth-secret header value below is hardcoded, not templated —
# confirmed empirically against a running 5.8.6 broker that the `${...}`
# syntax inside an authn/authz source's `headers`/`body` is EMQX's own
# request-templating engine (MQTT connection-context placeholders only:
# username/password/clientid/...), not OS environment variable substitution;
# an unrecognized name like ${EMQX_AUTH_SHARED_SECRET} renders literally,
# which would send the literal string instead of the secret and make every
# callback fail auth. Matches this repo's existing convention of committing
# dev-only placeholder secrets (see infra/.env) — must be kept identical to
# EMQX_AUTH_SHARED_SECRET in infra/.env / infra/.env.example by hand.
#
# Anonymous access is off simply by configuring `authentication` below (this
# EMQX version has no top-level `allow_anonymous` key — confirmed via a
# `config_key_not_recognized` warning when one was present here). Every
# subscriber connection (app/worker.py, username=settings.mqtt_worker_username)
# — must authenticate through these callbacks. See app/ingestion/router.py's
# emqx_authenticate/emqx_authorize for exactly what each one checks.

node {
  name = "emqx@127.0.0.1"
  cookie = "emqxsecretcookie"
  data_dir = "data"
}

cluster {
  name = emqxcl
  discovery_strategy = manual
}

dashboard {
    listeners {
        http.bind = 18083
        https {
            ssl_options {
                certfile = "${EMQX_ETC_DIR}/certs/cert.pem"
                keyfile = "${EMQX_ETC_DIR}/certs/key.pem"
            }
        }
    }
}

authentication = [
  {
    mechanism = password_based
    backend = http
    method = post
    url = "http://api:8000/ingestion/emqx/authenticate"
    body {
      username = "${username}"
      password = "${password}"
    }
    headers {
      "content-type" = "application/json"
      "x-emqx-auth-secret" = "dev-only-change-me"
    }
    pool_size = 8
    connect_timeout = "5s"
    request_timeout = "5s"
  }
]

authorization {
  sources = [
    {
      type = http
      method = post
      url = "http://api:8000/ingestion/emqx/authorize"
      body {
        username = "${username}"
        topic = "${topic}"
        action = "${action}"
      }
      headers {
        "content-type" = "application/json"
        "x-emqx-auth-secret" = "dev-only-change-me"
      }
      pool_size = 8
      connect_timeout = "5s"
      request_timeout = "5s"
    }
  ]
  no_match = deny
  deny_action = disconnect
}
