# iot-saas — development stack
#
# Full containerized dev stack: infrastructure (TimescaleDB, Redis, EMQX) plus the
# application (api, worker, frontend). Source is bind-mounted for hot reload.
#
#   cd iot-saas && cp infra/.env.example infra/.env
#   docker compose -f infra/docker-compose.yml up -d --build
#
# Optional dev tooling (pgAdmin, RedisInsight) is opt-in:
#   docker compose -f infra/docker-compose.yml --profile tools up -d
#
# Ports are bound to 127.0.0.1 only. Dev MQTT is plaintext on 1883 (TLS on 8883 is a
# production/VPS deployment step, not part of local dev). Per-device auth (Phase 2) is
# on: EMQX authenticates and authorizes every client — devices and the worker's own
# subscriber connection alike — via HTTP callbacks into the api container, configured
# declaratively in emqx/emqx.conf (mounted below) rather than through the dashboard.

name: iot-saas

services:
  # ── Infrastructure ────────────────────────────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./timescaledb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  emqx:
    image: emqx/emqx:5.8
    restart: unless-stopped
    environment:
      EMQX_NODE__COOKIE: ${EMQX_NODE_COOKIE:-iot-saas-dev-cookie}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-public}
    ports:
      - "0.0.0.0:1883:1883"       # MQTT (plaintext, dev only) — exposed to LAN
      - "127.0.0.1:18083:18083"   # dashboard
    volumes:
      - emqx-data:/opt/emqx/data
      - ./emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 12

  # ── Application (Python backend: two processes, one image) ────────────────
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_DATABASE_URL: ${APP_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: ${MQTT_PORT}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      EMQX_AUTH_SHARED_SECRET: ${EMQX_AUTH_SHARED_SECRET}
      MQTT_WORKER_USERNAME: ${MQTT_WORKER_USERNAME}
      MQTT_WORKER_PASSWORD: ${MQTT_WORKER_PASSWORD}
      TELEMETRY_BATCH_SIZE: ${TELEMETRY_BATCH_SIZE}
      TELEMETRY_FLUSH_INTERVAL_MS: ${TELEMETRY_FLUSH_INTERVAL_MS}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "app.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_DATABASE_URL: ${APP_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: ${MQTT_PORT}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      EMQX_AUTH_SHARED_SECRET: ${EMQX_AUTH_SHARED_SECRET}
      MQTT_WORKER_USERNAME: ${MQTT_WORKER_USERNAME}
      MQTT_WORKER_PASSWORD: ${MQTT_WORKER_PASSWORD}
      TELEMETRY_BATCH_SIZE: ${TELEMETRY_BATCH_SIZE}
      TELEMETRY_FLUSH_INTERVAL_MS: ${TELEMETRY_FLUSH_INTERVAL_MS}
    volumes:
      - ../backend:/app
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["pnpm", "dev"]
    environment:
      # Browser-side calls go to the host-published API port, not the compose network.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - api

  # ── Optional dev tooling (opt-in: --profile tools) ────────────────────────
  pgadmin:
    image: dpage/pgadmin4:8
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@iot-saas.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - timescaledb

  redisinsight:
    image: redis/redisinsight:latest
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      - redis

volumes:
  timescale-data:
  redis-data:
  emqx-data:
  frontend-node-modules:
  pgadmin-data:
  redisinsight-data:
