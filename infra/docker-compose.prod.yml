# iot-saas — production stack (single VPS, Docker Compose)
#
# Differs from docker-compose.yml (dev) in every way production requires:
#   - built images (backend/Dockerfile.prod, frontend/Dockerfile.prod), no bind
#     mounts, no --reload / `next dev`
#   - nginx terminates TLS for the web/API traffic; EMQX terminates TLS itself
#     for device MQTT on 8883 (see infra/emqx/emqx.prod.conf.template)
#   - only nginx (80/443) and EMQX's TLS listener (8883) are reachable from the
#     internet. Postgres, Redis, and plain MQTT (1883, worker<->broker only)
#     stay on the internal compose network. The EMQX dashboard (18083) and the
#     api/frontend ports are bound to 127.0.0.1 only, for an SSH-tunnel-only
#     debug path — see infra/PROD_DEPLOY.md.
#   - restart: always (dev uses unless-stopped, which is fine too, but a VPS
#     reboot after a provider maintenance window should come back on its own
#     without a human re-running `docker compose up`)
#
# Usage — see infra/PROD_DEPLOY.md for the full sequence (DNS, cert issuance,
# env generation). Short version, once infra/.env.prod exists and certs have
# been issued once via the certbot profile:
#
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --build

name: iot-saas-prod

# Every container's log is rotated: Docker's json-file driver keeps them
# forever by default, and at the design load the worker alone wrote GBs a day.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # ── Infrastructure ────────────────────────────────────────────────────────
  timescaledb:
    logging: *default-logging
    image: timescale/timescaledb:2.17.2-pg16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./timescaledb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    logging: *default-logging
    image: redis:7-alpine
    restart: always
    # Hard memory cap; noeviction so nothing (rule-state checkpoints, the
    # stream) is silently evicted. The stream itself is capped by the app
    # (TELEMETRY_STREAM_MAXLEN), so this is the backstop, not the limit.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  emqx:
    logging: *default-logging
    image: emqx/emqx:5.8
    restart: always
    environment:
      EMQX_NODE__COOKIE: ${EMQX_NODE_COOKIE}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD}
    ports:
      - "0.0.0.0:8883:8883"      # MQTT over TLS — devices connect here
      - "127.0.0.1:18083:18083"  # dashboard — SSH tunnel only, never public
    volumes:
      - emqx-data:/opt/emqx/data
      - ./emqx/emqx.prod.conf:/opt/emqx/etc/emqx.conf:ro
      - certbot-certs:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 12
    # Note: 1883 (plaintext) is intentionally NOT published here. The worker
    # reaches it over the internal compose network as emqx:1883 — that hop
    # never leaves the Docker host, so it doesn't need TLS. Public devices are
    # required to use 8883.

  # ── Application ──────────────────────────────────────────────────────────
  api:
    logging: *default-logging
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    restart: always
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_DATABASE_URL: ${APP_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: ${MQTT_PORT}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      EMQX_AUTH_SHARED_SECRET: ${EMQX_AUTH_SHARED_SECRET}
      MQTT_WORKER_USERNAME: ${MQTT_WORKER_USERNAME}
      MQTT_WORKER_PASSWORD: ${MQTT_WORKER_PASSWORD}
      GOOGLE_CLIENT_ID_WEB: ${GOOGLE_CLIENT_ID_WEB:-}
      GOOGLE_CLIENT_ID_ANDROID: ${GOOGLE_CLIENT_ID_ANDROID:-}
      MQTT_SIMULATOR_USERNAME: ${MQTT_SIMULATOR_USERNAME:-__simulator__}
      MQTT_SIMULATOR_PASSWORD: ${MQTT_SIMULATOR_PASSWORD:-}
      TELEMETRY_BATCH_SIZE: ${TELEMETRY_BATCH_SIZE}
      TELEMETRY_STREAM_MAXLEN: ${TELEMETRY_STREAM_MAXLEN:-750000}
      TELEMETRY_FLUSH_INTERVAL_MS: ${TELEMETRY_FLUSH_INTERVAL_MS}
      REALTIME_FLUSH_INTERVAL_MS: ${REALTIME_FLUSH_INTERVAL_MS:-250}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      # Email: invitations, password resets and the contact form are sent
      # by the api; rule alerts by the worker — both need the same settings.
      # Without these lines .env.prod's values never reach the container and
      # email silently falls back to "console" (logged, never sent).
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      CONTACT_EMAIL_TO: ${CONTACT_EMAIL_TO:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_FROM: ${EMAIL_FROM:-alerts@example.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-IO Driven Platform Alerts}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      # Mobile app releases (docs/mobile-release.md): /meta/client.
      MIN_MOBILE_VERSION: ${MIN_MOBILE_VERSION:-0.0.0}
      LATEST_MOBILE_VERSION: ${LATEST_MOBILE_VERSION:-}
      MOBILE_UPDATE_URL: ${MOBILE_UPDATE_URL:-https://github.com/cortegab/iot-saas/releases}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy

  worker:
    logging: *default-logging
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    restart: always
    command: ["uv", "run", "python", "-m", "app.worker"]
    # Unhealthy when the worker's heartbeat (app.readiness) is stale or it has
    # lost the broker: shows in `docker compose ps`; GET /health/ready reports
    # the same to the external uptime monitor.
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "python", "-m", "app.readiness.check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_DATABASE_URL: ${APP_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: ${MQTT_PORT}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      EMQX_AUTH_SHARED_SECRET: ${EMQX_AUTH_SHARED_SECRET}
      MQTT_WORKER_USERNAME: ${MQTT_WORKER_USERNAME}
      MQTT_WORKER_PASSWORD: ${MQTT_WORKER_PASSWORD}
      MQTT_SIMULATOR_USERNAME: ${MQTT_SIMULATOR_USERNAME:-__simulator__}
      MQTT_SIMULATOR_PASSWORD: ${MQTT_SIMULATOR_PASSWORD:-}
      TELEMETRY_BATCH_SIZE: ${TELEMETRY_BATCH_SIZE}
      TELEMETRY_STREAM_MAXLEN: ${TELEMETRY_STREAM_MAXLEN:-750000}
      TELEMETRY_FLUSH_INTERVAL_MS: ${TELEMETRY_FLUSH_INTERVAL_MS}
      # Same email settings as the api (rule alerts are sent from here).
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_FROM: ${EMAIL_FROM:-alerts@example.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-IO Driven Platform Alerts}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      # Push notifications (docs/mobile-push.md): the Firebase service-account
      # key, mounted read-only below. Unset on the host: push stays off.
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:+/run/secrets/fcm-service-account.json}
    volumes:
      - ${FCM_SERVICE_ACCOUNT_FILE:-/dev/null}:/run/secrets/fcm-service-account.json:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy

  frontend:
    logging: *default-logging
    build:
      # The repo root: the web app is part of the pnpm workspace (root
      # .dockerignore keeps the context to the workspace files).
      context: ..
      dockerfile: frontend/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: always
    environment:
      # Android App Links for device labels (/.well-known/assetlinks.json).
      ANDROID_APP_CERT_SHA256: ${ANDROID_APP_CERT_SHA256:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  # ── Edge: TLS termination + reverse proxy ───────────────────────────────
  nginx:
    logging: *default-logging
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Firmware releases served at /firmware/ (see the nginx template),
      # published here by .github/workflows/deploy-prod.yml.
      - ./firmware:/usr/share/nginx/firmware:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
    depends_on:
      - api
      - frontend

  # One-off / periodic — never part of the default `up`. See
  # infra/PROD_DEPLOY.md and infra/backups/renew-certs.sh for how this is
  # invoked (`docker compose ... run --rm certbot ...`).
  certbot:
    logging: *default-logging
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot

volumes:
  timescale-data:
  redis-data:
  emqx-data:
  certbot-certs:
  certbot-webroot:
