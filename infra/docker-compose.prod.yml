# iot-saas — production stack (single VPS, Docker Compose)
#
# Differs from docker-compose.yml (dev) in every way production requires:
#   - built images (backend/Dockerfile.prod, frontend/Dockerfile.prod), no bind
#     mounts, no --reload / `next dev`
#   - nginx terminates TLS for the web/API traffic; EMQX terminates TLS itself
#     for device MQTT on 8883 (see infra/emqx/emqx.prod.conf.template)
#   - only nginx (80/443) and EMQX's TLS listener (8883) are reachable from the
#     internet. Postgres, Redis, and plain MQTT (1883, worker<->broker only)
#     stay on the internal compose network. The EMQX dashboard (18083) and the
#     api/frontend ports are bound to 127.0.0.1 only, for an SSH-tunnel-only
#     debug path — see infra/PROD_DEPLOY.md.
#   - restart: always (dev uses unless-stopped, which is fine too, but a VPS
#     reboot after a provider maintenance window should come back on its own
#     without a human re-running `docker compose up`)
#
# Usage — see infra/PROD_DEPLOY.md for the full sequence (DNS, cert issuance,
# env generation). Short version, once infra/.env.prod exists and certs have
# been issued once via the certbot profile:
#
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --build

name: iot-saas-prod

services:
  # ── Infrastructure ────────────────────────────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./timescaledb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  emqx:
    image: emqx/emqx:5.8
    restart: always
    environment:
      EMQX_NODE__COOKIE: ${EMQX_NODE_COOKIE}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD}
    ports:
      - "0.0.0.0:8883:8883"      # MQTT over TLS — devices connect here
      - "127.0.0.1:18083:18083"  # dashboard — SSH tunnel only, never public
    volumes:
      - emqx-data:/opt/emqx/data
      - ./emqx/emqx.prod.conf:/opt/emqx/etc/emqx.conf:ro
      - certbot-certs:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 12
    # Note: 1883 (plaintext) is intentionally NOT published here. The worker
    # reaches it over the internal compose network as emqx:1883 — that hop
    # never leaves the Docker host, so it doesn't need TLS. Public devices are
    # required to use 8883.

  # ── Application ──────────────────────────────────────────────────────────
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    restart: always
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_DATABASE_URL: ${APP_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: ${MQTT_PORT}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      EMQX_AUTH_SHARED_SECRET: ${EMQX_AUTH_SHARED_SECRET}
      MQTT_WORKER_USERNAME: ${MQTT_WORKER_USERNAME}
      MQTT_WORKER_PASSWORD: ${MQTT_WORKER_PASSWORD}
      TELEMETRY_BATCH_SIZE: ${TELEMETRY_BATCH_SIZE}
      TELEMETRY_FLUSH_INTERVAL_MS: ${TELEMETRY_FLUSH_INTERVAL_MS}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    restart: always
    command: ["uv", "run", "python", "-m", "app.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_DATABASE_URL: ${APP_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: ${MQTT_PORT}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      EMQX_AUTH_SHARED_SECRET: ${EMQX_AUTH_SHARED_SECRET}
      MQTT_WORKER_USERNAME: ${MQTT_WORKER_USERNAME}
      MQTT_WORKER_PASSWORD: ${MQTT_WORKER_PASSWORD}
      TELEMETRY_BATCH_SIZE: ${TELEMETRY_BATCH_SIZE}
      TELEMETRY_FLUSH_INTERVAL_MS: ${TELEMETRY_FLUSH_INTERVAL_MS}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  # ── Edge: TLS termination + reverse proxy ───────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
    depends_on:
      - api
      - frontend

  # One-off / periodic — never part of the default `up`. See
  # infra/PROD_DEPLOY.md and infra/backups/renew-certs.sh for how this is
  # invoked (`docker compose ... run --rm certbot ...`).
  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot

volumes:
  timescale-data:
  redis-data:
  emqx-data:
  certbot-certs:
  certbot-webroot:
