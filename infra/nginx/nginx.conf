# Main nginx config for the production edge. Site-specific server blocks live
# in conf.d/ (generated from conf.d/iot-saas.conf.template — see
# infra/PROD_DEPLOY.md — because the domain names aren't known until deploy
# time and nginx has no env-var substitution of its own).

user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Standard WebSocket upgrade map — `Connection: upgrade` only for actual
    # upgrade requests (app/realtime's /ws endpoint), `close` otherwise.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
