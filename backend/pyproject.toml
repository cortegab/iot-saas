[project]
name = "iot-saas-backend"
version = "0.0.1"
description = "iot-saas backend — FastAPI API server and ingestion/rules worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "aiomqtt>=2.3",
    "redis>=5.2",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
# B008: FastAPI's Depends()-as-a-default-argument is the documented DI pattern
# (CLAUDE.md §7), not the antipattern this rule normally guards against.
ignore = ["B008"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
